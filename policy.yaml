# The rules the catalog applies to a submission. `scripts/queue.py validate` reads this on every
# pull request. Changing what the App Fair accepts is an edit to this file.

# The bundle-id namespace the App Fair publishes in
# (https://appfair.org/docs/building/#bundle-id). Every id a submission resolves to starts with
# it; what follows is the app's own. `<namespace><token>` is the convention for a new app. The id
# comes from the build, and `Day-<flavor>.toml` in the app is where it is stated.
id-namespace: org.appfair.app.

# The app token: the name of the app's GitHub organization and repository, and the name of its
# file under apps/. It does not change for the life of the app.
token-pattern: '^[A-Za-z][A-Za-z0-9-]{1,38}$'

# Submissions name a released tag, so what is built is what the maintainer released. The tag also
# names the version: `verify` refuses an app that builds another one.
tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

# ...and the commit that tag pointed at when the submission was written. Tags can be moved, so
# every stage checks out the commit and compares the tag against it.
commit-pattern: '^[0-9a-f]{40}$'

# The channels an app can be published to, listed in a submission under the target that builds
# for them. A target can feed more than one channel.
#
# `lane` submits the build for review and distribution. `hold-lane` uploads without submitting,
# for a submission that sets `submit: false`.
#
#   target        the Day target whose package this channel takes
#   lane          the fastlane lane that submits it for review and distribution
#   hold-lane     the lane that uploads without submitting, for `submit: false`
#   options       the settings a submission may give this channel
#   status        `ready`, or `planned` for a declared channel with no implementation yet
channels:
  apple-app-store:
    target: ios-uikit
    lane: ios release
    hold-lane: ios upload
    options: [submit, profile-secret]
    status: ready
  google-play-store:
    target: android-mdc
    lane: android release
    hold-lane: android upload
    options: [submit]
    status: ready
  # Declared but not implemented. A submission naming one of these is rejected with that reason.
  # Implementing one means changing `status` here and adding an arm to .github/actions/sign-submit.
  altstore:
    target: ios-uikit
    options: [submit]
    status: planned
  f-droid:
    target: android-mdc
    options: []
    status: planned
  samsung-galaxy-store:
    target: android-mdc
    options: [submit]
    status: planned

# The Day build flavor a submission is built with when the app carries one. Defaults to this
# repository's name without the `-apps` suffix, so a fork called `gamesfair-apps` builds each
# app's `gamesfair` flavor. An app without `Day-<flavor>.toml` is built as it stands.
#
# flavor: appfair

# The runner each target builds and validates on. It matches what the app's CI used: another
# runner image means another Xcode and SDK, and an Info.plist that cannot agree. `xcode-27` is
# the floor daybrite/actions builds on.
runners:
  ios-uikit: xcode-27
  android-mdc: ubuntu-latest

# Which day CLI builds every submission. `main` tracks the framework; a released version pins it.
day-version: main

# --- The reviewer's summary ------------------------------------------------------------------
# The pull-request checks work out the range between the published commit and the proposed one
# and post it as a comment, so a reviewer reads the source changes before approving.
review:
  # The paths to open first: what runs during a build, what pulls in a dependency, and what sets
  # the app's identity or permissions. Matched with fnmatch, where `*` crosses directories.
  highlight-paths:
    - "Cargo.toml"
    - "*/Cargo.toml"
    - "Cargo.lock"
    - "*build.rs"
    - "Day.toml"
    - "Day-*.toml"
    - ".cargo/*"
    - ".github/workflows/*"
    - "*.gradle"
    - "*.gradle.kts"
    - "*AndroidManifest.xml"
    - "*Info.plist"
    - "*.entitlements"
    - "*.pbxproj"
    - "*Package.swift"
    - "*.sh"
  # How many of those paths the comment lists before it says how many are left.
  max-highlights: 20

# App Store profiles are issued per bundle id. The signing stage requests one during the run with
# `fastlane sigh`, so none are stored here. An app that needs a particular profile names the
# secret holding it in its `apple-app-store: profile-secret`.

# --- The listing's screenshots -----------------------------------------------------------------
# An app declares which captures each store's listing shows in its store/app.toml
# `[storefront.<target>.<store>.screenshots]` (per device kind, or `default`), naming its walkthrough's
# `screenshot:` steps and the theme to take; `day screenshot index` resolves that into the
# index's `listings`, and the app's CI attaches the index (gallery.json) and the captures
# (screenshots.zip) to the release. The review shows exactly those, and the signing stage
# places them in the fastlane tree for every locale the store knows.
#
# What each store accepts, per device kind the walkthrough captures on: the fallback for a release
# without a `storefront.json` (`day store export` carries the rules the app's CLI held the listing
# to, and the queue reads those first). Apple takes exact sizes
# (developer.apple.com/help/app-store-connect/reference/screenshot-specifications). Google's
# numbers are what its publishing API enforces, "min size: [1080], max size: [7680], max aspect
# ratio: [2.3]" (the refusal it sent for a 1280x800 tablet capture, 2026-09-24), which is not
# what its help page states (320 px, 2:1). `required` device kinds need at least one screenshot
# in every locale of the listing; `max` is the store's ceiling per kind.
screenshots:
  apple-app-store:
    iphone:
      required: true
      max: 10
      sizes: [[1320, 2868], [2868, 1320], [1290, 2796], [2796, 1290], [1260, 2736], [2736, 1260]]
    ipad:
      required: true
      max: 10
      sizes: [[2064, 2752], [2752, 2064], [2048, 2732], [2732, 2048]]
  google-play-store:
    phone:
      required: true
      max: 8
      min-side: 1080
      max-side: 7680
      max-ratio: 2.3
    tablet:
      required: false
      max: 8
      min-side: 1080
      max-side: 7680
      max-ratio: 2.3

# --- The maintainer's release ----------------------------------------------------------------
# The packages this queue signs are attached to the release the submission names, beside the ones
# the maintainer published. They carry the build flavor in their names
# (`games-fair-appfair-android-mdc.aab`), so nothing of the maintainer's is replaced.
#
# It takes write access to the app's repository, granted to the account below. An app that has
# granted nothing still publishes: `on-missing-access: warn` leaves the signed packages as a
# workflow artifact to attach by hand, where `error` would stop the submission.
#
# Once every package is on the release, a pre-release is marked as the latest one, so
# `releases/latest/download/<name>` answers between a tag and its publication.
release-upload:
  # The App Fair GitHub App, which a maintainer installs on their repository. The queue signs its
  # own requests with APPFAIR_APP_PRIVATE_KEY and this id, then mints a token for that repository
  # alone, for one hour, with Contents: Read and write. `app-id` empty leaves the app unused.
  app: app-fair-publisher
  app-id: "5040724"
  on-missing-access: warn
  promote-prerelease: true

# --- Stage B -------------------------------------------------------------------------------
# Reads the packages stage A built and compares them with the app's release of the same commit.
# Nothing it reads is executed.

# Extra paths to ignore when comparing. Signature directories are already excluded.
ignore-in-comparison:
  - "*.kotlin_module"
  - "stamp-cert-sha256"

# Paths allowed to differ between the two builds. Where a flavor states another display name, day
# compiles it into the binary through `day_build::app_title()`, so that file cannot match byte
# for byte. A difference here is reported and passes; anywhere else it still counts.
#
# Matched with fnmatch against the comparison's keys, where the iOS bundle is keyed as
# `Payload/App.app` and its main binary as `<executable>`.
expected-differences:
  - "base/lib/*/libdayapp.so"
  - "Payload/App.app/<executable>"

# What an unexpected difference between the two builds does: `block` stops the submission,
# `advisory` records it and continues. A maintainer re-runs a blocked submission with the label
# below.
mismatch: block
override-label: allow-mismatch

# Scan every file in the package with ClamAV before signing it.
virus-scan: true

# Permissions the framework adds to every app, which no app manifest declares. `{id}` stands for
# the application id. Anything beyond this list and the app's declarations is reported.
baseline-permissions:
  android:
    - android.permission.INTERNET
    - android.permission.VIBRATE
    - "{id}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
  ios: []

# The paths stages B and C read out of the app's repository: manifests, store copy and
# translations. The checkout is sparse, so no source or build script reaches those runners.
app-data-paths:
  - Cargo.toml
  - Day.toml
  - Day-*.toml
  - store
  - store-*
  - resource/locales
  - resource-*/locales
  # The site's host: the review links a capture to the site's copy of it when one is served.
  - website/site.toml
