# The rules the catalog applies to a submission. `scripts/queue.py validate` reads this on every
# pull request. Changing what the App Fair accepts is an edit to this file.

# The bundle-id namespace. The App Fair Project is the publisher of record for everything in it
# (https://appfair.org/docs/building/#bundle-id). An app publishes as `<namespace><token>` unless
# its submission states an `id`, which a renamed app does to keep the record the stores hold; that
# id stays inside this namespace.
id-namespace: org.appfair.app.

# The app token: the name of the app's GitHub organization and repository, the last segment of its
# bundle id, and the name of its file under apps/. It does not change for the life of the app.
token-pattern: '^[A-Za-z][A-Za-z0-9-]{1,38}$'

# Submissions name a released tag, so that what is built is what the maintainer released and is
# still there later. The tag also names the version: `verify` refuses a submission whose app
# builds a version other than the one in the tag.
tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

# ...and the commit that tag pointed at when the submission was written. Tags can be moved, so
# every stage checks out the commit and compares the tag against it.
commit-pattern: '^[0-9a-f]{40}$'

# The channels an app can be published to. A submission lists its channels under the target that
# builds for them, and a target can feed more than one channel.
#
# Publishing means asking the store to review the build and distribute it. `lane` is what a
# submission runs, and it is the lane that submits; `hold-lane` is the exception, for a submission
# that sets `submit: false` and wants the build uploaded and left alone.
#
#   target        the Day target whose package this channel takes
#   lane          the fastlane lane that submits it for review and distribution
#   hold-lane     the lane that uploads without submitting, for `submit: false`
#   options       the settings a submission may give this channel
#   status        `ready`, or `planned` for a declared channel with no implementation yet
channels:
  apple-app-store:
    target: ios-uikit
    lane: ios release
    hold-lane: ios upload
    options: [submit, profile-secret]
    status: ready
  google-play-store:
    target: android-mdc
    lane: android release
    hold-lane: android upload
    options: [submit]
    status: ready
  # Declared but not implemented. A submission naming one of these is rejected with that reason.
  # Implementing one means changing `status` here and adding an arm to .github/actions/sign-submit.
  altstore:
    target: ios-uikit
    options: [submit]
    status: planned
  f-droid:
    target: android-mdc
    options: []
    status: planned
  samsung-galaxy-store:
    target: android-mdc
    options: [submit]
    status: planned

# The Day build flavor a submission is built with when the app carries one. It defaults to this
# repository's name without the `-apps` suffix, so `appfair-apps` builds each app's `appfair`
# flavor and a fork called `gamesfair-apps` builds `gamesfair` with no edit here. The flavor's
# manifest (`Day-<flavor>.toml` in the app) carries the identity the app is published under, for
# an app whose own builds go out under another. An app without that file is built as it stands.
#
# flavor: appfair

# The runner each target builds and validates on. It has to match what the app's own CI used,
# because the comparison holds the two builds against each other: a different runner image means
# a different Xcode, a different SDK, and an Info.plist and binary that cannot agree. `xcode-27`
# is the floor daybrite/actions builds every app on, which is what publishes the release this
# queue compares against.
runners:
  ios-uikit: xcode-27
  android-mdc: ubuntu-latest

# Which day CLI builds every submission. `main` tracks the framework; a released version pins it.
day-version: main

# --- The reviewer's summary ------------------------------------------------------------------
# An update moves the tag and the commit a submission pins. The pull-request checks work out the
# range between the commit already published and the proposed one, and post it as a comment, so a
# reviewer can read the source changes going into the release before approving it.
review:
  # Paths worth opening first in that range: what runs during a build, what pulls in a dependency,
  # and what decides the app's identity or permissions. Anything matching is listed in the
  # comment; everything else is behind the compare link. Patterns are matched with fnmatch, where
  # `*` also crosses directory separators.
  highlight-paths:
    - "Cargo.toml"
    - "*/Cargo.toml"
    - "Cargo.lock"
    - "*build.rs"
    - "Day.toml"
    - "Day-*.toml"
    - ".cargo/*"
    - ".github/workflows/*"
    - "*.gradle"
    - "*.gradle.kts"
    - "*AndroidManifest.xml"
    - "*Info.plist"
    - "*.entitlements"
    - "*.pbxproj"
    - "*Package.swift"
    - "*.sh"
  # How many of those paths the comment lists before it says how many are left.
  max-highlights: 20

# App Store provisioning profiles are issued per bundle id. The signing stage requests one during
# the run with `fastlane sigh`, against the certificate that will sign the package, so none are
# stored here. An app that needs a particular profile names the secret holding it in its own
# `apple-app-store: profile-secret`.

# --- Stage B -------------------------------------------------------------------------------
# Stage B reads the packages stage A built and compares them with the app's own release of the
# same commit. It does not execute anything it reads.

# Extra paths to ignore when comparing. Signature directories are already excluded.
ignore-in-comparison:
  - "*.kotlin_module"
  - "stamp-cert-sha256"

# Paths allowed to differ between the two builds. Where a flavor states a different display name,
# day compiles that name into the app through `day_build::app_title()`, so the native code a
# flavor build produces cannot match the base release byte for byte. An app with no flavor builds
# from one manifest and matches everywhere; these allowances simply go unused. A difference in one of these
# is reported and passes; a difference anywhere else — another file, a changed asset, different
# DEX, an extra library — still counts.
#
# Patterns are matched with fnmatch against the comparison's keys, where the iOS bundle is keyed
# as `Payload/App.app` and its main binary as `<executable>`.
expected-differences:
  - "base/lib/*/libdayapp.so"
  - "Payload/App.app/<executable>"

# What an unexpected difference between the two builds does: `block` stops the submission,
# `advisory` records it and continues. A maintainer re-runs a blocked submission with the label
# below.
mismatch: block
override-label: allow-mismatch

# Scan every file in the package with ClamAV before signing it.
virus-scan: true

# Permissions the framework and its pieces add to every app, which no app manifest declares.
# `{id}` stands for the application id. Anything beyond this list and the app's own declarations
# is reported.
baseline-permissions:
  android:
    - android.permission.INTERNET
    - android.permission.VIBRATE
    - "{id}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
  ios: []

# The paths stages B and C read out of the app's repository: manifests, store copy and
# translations. The checkout is sparse, so no source or build script reaches those runners.
app-data-paths:
  - Cargo.toml
  - Day.toml
  - Day-*.toml
  - store
  - store-*
  - resource/locales
  - resource-*/locales
