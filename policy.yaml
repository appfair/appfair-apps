# The catalog's rules, in one file, so the scripts that enforce them carry no policy of their own
# and a reviewer can change what the App Fair accepts without touching a line of code.
# `scripts/queue.py validate` reads this on every pull request.

# Every app the App Fair publishes is published by the App Fair: the bundle ids live in this
# namespace, and the App Fair Project is the publisher of record for them
# (https://appfair.org/docs/building/#bundle-id).
id-namespace: org.appfair.app.

# The app token: the name of the app's GitHub organization and repository, and the last segment
# of its bundle id. It is immutable for the life of the app and unique in this catalog, which is
# why it is also the name of the file under apps/.
token-pattern: '^[A-Za-z][A-Za-z0-9-]{1,38}$'

# A submission names a released tag of the app. What gets built has to be what the maintainer
# released, and it has to still be there a year from now.
tag-pattern: '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'

# The targets a submission may ask for. Both stores are here; the catalog's other channels
# (F-Droid, desktop, web) build from the same tag and go through a different path.
store-targets:
  - ios-uikit
  - android-mdc

# Which day CLI the queue builds every submission with. `main` tracks the framework; a released
# version freezes what the catalog builds against.
day-version: main

# The secret holding the base64 App Store provisioning profile. A submission may name a different
# secret in its `apple.profile-secret`; this is the default, and the only value a first-time
# submission should need.
default-ios-profile-secret: DAY_IOS_PROFILE_B64

# --- What the validation stage checks -------------------------------------------------------
# Stage B reads the packages stage A built and compares them with the release the maintainer
# published from the same tag. It runs none of what it reads.

# Paths inside a package that signing writes, and anything else whose difference says nothing
# about the build. The signature directories are excluded already; these are the extras.
ignore-in-comparison:
  - "*.kotlin_module"
  - "stamp-cert-sha256"

# What happens when the two builds differ: `block` stops the submission, `advisory` records the
# differences and continues. A maintainer re-runs a blocked submission with the label below once
# the cause is understood.
mismatch: block
override-label: allow-mismatch

# Scan every file in the package with ClamAV before signing it.
virus-scan: true

# Permissions the framework and its pieces add to every app, which an app's manifest therefore
# never declares. `{id}` stands for the application id. Anything a package asks for beyond this
# list and the app's own declarations is a finding.
baseline-permissions:
  android:
    - android.permission.INTERNET
    - android.permission.VIBRATE
    - "{id}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
  ios: []

# The paths stages B and C read out of the app's repository. They hold manifests, store copy and
# translations, and no source, no build scripts and no project files that a build tool would
# execute. The checkout is sparse, so nothing else reaches those runners.
app-data-paths:
  - Cargo.toml
  - Day.toml
  - Day-*.toml
  - store
  - store-*
  - resource/locales
  - resource-*/locales
