# yaml-language-server: $schema=../schema/app.schema.json
#
# Stanza Redux in the App Fair catalog. The file is named for the app token, which is where the app
# lives: https://github.com/Stanza-Redux/Stanza-Redux
#
# To publish a new version, change the tag and the commit below in a pull request. The rest is
# read from the app's repository at that commit.

token: Stanza-Redux
title: Stanza Redux
tag: v2.0.4
# The commit that tag points at. Since a tag can be moved afterwards, this is what every stage
# checks out. `scripts/queue.py update Stanza-Redux` rewrites both lines.
commit: fe4343b5dfd0b19298b458fe6650b0d2a75949ac

# Where this app goes, keyed by the target that builds for it. policy.yaml lists the channels the
# queue can publish to. Drop a line to keep the app off a channel.
distribution:
  android-mdc:
    - google-play-store
  ios-uikit:
    - apple-app-store
