# Merging a submission publishes it: the pull request's stages, plus signing and upload.
#
#   plan, verify   this repository and the app's manifest. No app code, no secrets.
#   build          runs the app's build. App code, no secrets.
#   validate       reads what the build produced. No app code, no secrets.
#   publish        signs that package and uploads it. Secrets, no app code.
#   attach         keeps the signed packages as an artifact and puts them on the app's release.
#
# The build job holds no keys, and the job that holds the keys re-signs an archive rather than
# running the app's code. Merging is the approval: branch protection on `main` and CODEOWNERS on
# `apps/` decide who can start a run.
name: publish

on:
  push:
    branches: [main]
    paths:
      - apps/**
  workflow_dispatch:
    inputs:
      app:
        description: The app token to publish again, as `apps/<token>.yaml` names it.
        required: true
        type: string
      channel:
        description: >-
          Publish to this channel alone, such as google-play-store. Empty publishes to every
          channel the submission names, as a merge does.
        required: false
        type: string
      lane:
        description: >-
          Run this fastlane lane instead of the channel's own, with `channel`. `ios submit`
          attaches a binary App Store Connect already has and submits it, where the usual lane
          would upload the same build number again and be refused.
        required: false
        type: string
      allow-mismatch:
        description: Accept differences from the maintainer's release for this run.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      publish-matrix: ${{ steps.plan.outputs.publish-matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run the catalog's selftest
        run: python3 scripts/queue.py selftest
      - name: Plan what to publish
        id: plan
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.app }}" ]; then
            python3 scripts/queue.py plan --app "${{ inputs.app }}" \
              ${{ inputs.channel && format('--channel {0}', inputs.channel) || '' }} \
              ${{ inputs.lane && format('--lane "{0}"', inputs.lane) || '' }}
          else
            python3 scripts/queue.py plan --changed-from "${{ github.event.before }}"
          fi

  # The pull request's checks, repeated against what is now on `main`.
  verify:
    name: verify ${{ matrix.token }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # A tag can move between the review and the merge. The build follows the pinned commit
          # either way; the check below reports the move.
          PEELED=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}^{}" | cut -f1)
          PLAIN=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}" | cut -f1)
          echo "TAG_COMMIT=${PEELED:-$PLAIN}" >> "$GITHUB_ENV"
          echo "${{ matrix.tag }} → ${PEELED:-$PLAIN}"
      - name: Read the manifest paths
        id: paths
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("sparse<<EOF")
          print("\n".join(yaml.safe_load(open("policy.yaml"))["app-data-paths"]))
          print("EOF")
          PY
      - name: Check out the app's manifest
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: app-data
          sparse-checkout: ${{ steps.paths.outputs.sparse }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ matrix.day_version }}
      - name: Read the app's metadata
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.flavor }}"
          # The catalog names a flavor; carrying one is the app's choice. Without
          # `Day-<flavor>.toml` the manifest is read as it stands.
          if [ -n "$FLAVOR" ] && [ -f "app-data/Day-$FLAVOR.toml" ]; then
            (cd app-data && "$DAY_BIN" --flavor "$FLAVOR" metadata --json) > metadata.json
          else
            (cd app-data && "$DAY_BIN" metadata --json) > metadata.json
          fi
      - name: Verify the submission
        run: |
          python3 scripts/queue.py verify --app "${{ matrix.token }}" --metadata metadata.json \
            --tag-commit "${TAG_COMMIT:-}"

  # The write access the catalog attaches its signed packages with (policy.yaml
  # `release-upload`), reported before anything is built rather than after an hour of signing.
  # It does not gate the publication: without it the packages stay a workflow artifact.
  access:
    name: access ${{ matrix.token }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the release access
        env:
          APPFAIR_RELEASE_TOKEN: ${{ secrets.APPFAIR_RELEASE_TOKEN || secrets.APP_FAIR_BOT_TOKEN }}
        run: |
          python3 scripts/release_upload.py check \
            --repo "${{ matrix.repo }}" --tag "${{ matrix.tag }}"

  # Stage A: the app's build, on a runner with no credentials.
  build:
    name: build ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, verify]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-app
        with:
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
          if-no-files-found: error

  # Stage B: what has to be true about the package before it is signed.
  validate:
    name: validate ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
      - uses: ./.github/actions/validate-package
        with:
          token: ${{ matrix.token }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          tag: ${{ matrix.tag }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
          allow-mismatch: ${{ inputs.allow-mismatch && 'true' || 'false' }}
          github-token: ${{ github.token }}

  # Stage C: signing and upload. The only job that reaches the secrets, running the day CLI,
  # fastlane and the platform signing tools over an archive.
  publish:
    name: publish ${{ matrix.token }} → ${{ matrix.channel }}
    needs: [plan, validate]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    environment: store
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One at a time, so two merges cannot race into one store record.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.publish-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
      - uses: ./.github/actions/sign-submit
        with:
          token: ${{ matrix.token }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          target: ${{ matrix.target }}
          channel: ${{ matrix.channel }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
          lane: ${{ matrix.lane }}
          keystore-b64: ${{ secrets.DAY_ANDROID_KEYSTORE_B64 || secrets.KEYSTORE_JKS }}
          keystore-properties-b64: ${{ secrets.KEYSTORE_PROPERTIES }}
          key-alias: ${{ secrets.DAY_ANDROID_KEY_ALIAS }}
          keystore-password: ${{ secrets.DAY_KS_PASS }}
          key-password: ${{ secrets.DAY_KEY_PASS }}
          play-json-key: ${{ secrets.DAY_PLAY_JSON_KEY || secrets.GOOGLE_PLAY_APIKEY }}
          apple-cert-p12: ${{ secrets.DAY_APPLE_CERT_P12 || secrets.APPLE_CERTIFICATES_P12 }}
          apple-cert-password: ${{ secrets.DAY_APPLE_CERT_PASSWORD || secrets.APPLE_CERTIFICATES_P12_PASSWORD }}
          # The name on the catalog's certificate. Apple has issued both "iPhone Distribution"
          # and "Apple Distribution" certificates over the years, and codesign matches the name.
          apple-identity: ${{ secrets.DAY_APPLE_IDENTITY || 'Apple Distribution' }}
          # The fallback app id for the profile request, and the team that issues it. The id
          # published under comes from the app's manifest; the profile is issued during the run.
          app-id: ${{ matrix.app_id }}
          apple-team: ${{ secrets.DAY_APPLE_TEAM }}
          # Empty for nearly every app. One that needs a particular profile names the secret
          # holding it in its submission.
          apple-profile-b64: ${{ matrix.profile_secret != '' && secrets[matrix.profile_secret] || '' }}
          asc-api-key-b64: ${{ secrets.APPLE_APPSTORE_APIKEY }}
          asc-key-id: ${{ secrets.DAY_ASC_KEY_ID }}
          asc-issuer: ${{ secrets.DAY_ASC_ISSUER }}
          asc-key-b64: ${{ secrets.DAY_ASC_KEY_B64 }}

  # The signed packages: kept as an artifact, then attached to the app's own release beside the
  # maintainer's. They carry the flavor in their names, so nothing published there is replaced,
  # and a release that is still a pre-release becomes the latest one once they are all on it.
  # An app that granted the catalog no access is a warning here, not a failure.
  attach:
    name: attach ${{ matrix.token }}
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Collect what was signed
        uses: actions/download-artifact@v8
        with:
          pattern: published-${{ matrix.token }}-*
          path: packages
          merge-multiple: true
      - name: Gather them under their published names
        run: |
          python3 scripts/release_upload.py stage \
            --dir packages --out release-assets --flavor "${{ matrix.flavor }}"
      # Before the upload, and whatever the upload does: an app that granted no access still has
      # its signed packages here to attach by hand.
      - name: Keep them as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.token }}-${{ matrix.tag }}
          path: release-assets
          if-no-files-found: ignore
      - name: Attach them to ${{ matrix.tag }}
        env:
          APPFAIR_RELEASE_TOKEN: ${{ secrets.APPFAIR_RELEASE_TOKEN || secrets.APP_FAIR_BOT_TOKEN }}
        run: |
          python3 scripts/release_upload.py upload \
            --repo "${{ matrix.repo }}" --tag "${{ matrix.tag }}" \
            --dir release-assets --flavor "${{ matrix.flavor }}"

  # The catalog's state is a file in this repository.
  record:
    name: record ${{ matrix.token }}
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: record-state
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Record the publication
        run: |
          set -euo pipefail
          python3 scripts/queue.py record \
            --app "${{ matrix.token }}" \
            --tag "${{ matrix.tag }}" \
            --channels "${{ matrix.channels }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit the record
        run: |
          set -euo pipefail
          git config user.name "appfair-bot"
          git config user.email "bot@appfair.org"
          git add state/published.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          # `paths: apps/**` above keeps this commit from starting another run.
          git commit -m "Record ${{ matrix.token }} ${{ matrix.tag }} as published"
          git push origin HEAD:main
