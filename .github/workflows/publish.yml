# Merging a submission publishes it, through the three stages the pull request ran plus a fourth:
#
#   plan, verify   read this repository and the app's manifest. No app code, no secrets.
#   build          checks the app out and runs its build. App code, no secrets.
#   validate       reads what the build produced. No app code, no secrets.
#   publish        signs that package and hands it to the store. Secrets, and no app code.
#
# The job that builds a submitted app has no access to the keys, and the job that holds the keys
# does not run the app's code: it re-signs an archive and uploads it.
#
# Merging is the approval, so this workflow asks for none. Branch protection on `main` and
# CODEOWNERS on `apps/` decide who can start a run.
name: publish

on:
  push:
    branches: [main]
    paths:
      - apps/**
  workflow_dispatch:
    inputs:
      app:
        description: The app token to publish again, as `apps/<token>.yaml` names it.
        required: true
        type: string
      channel:
        description: >-
          Publish to this channel alone, such as google-play-store. Empty publishes to every
          channel the submission names, which is what a merge does.
        required: false
        type: string
      lane:
        description: >-
          Run this fastlane lane instead of the channel's own, with `channel`. `ios submit`
          attaches a binary App Store Connect already has and submits it, where the usual lane
          would upload the same build number again and be refused.
        required: false
        type: string
      allow-mismatch:
        description: Accept differences from the maintainer's release for this run.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      publish-matrix: ${{ steps.plan.outputs.publish-matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The catalog's own rules
        run: python3 scripts/queue.py selftest
      - name: Plan what this merge publishes
        id: plan
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.app }}" ]; then
            python3 scripts/queue.py plan --app "${{ inputs.app }}" \
              ${{ inputs.channel && format('--channel {0}', inputs.channel) || '' }} \
              ${{ inputs.lane && format('--lane "{0}"', inputs.lane) || '' }}
          else
            python3 scripts/queue.py plan --changed-from "${{ github.event.before }}"
          fi

  # The pull request's checks, repeated against what is now on `main`.
  verify:
    name: verify ${{ matrix.token }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Where does ${{ matrix.tag }} point now?
        run: |
          set -euo pipefail
          # A tag can move between the review and the merge. The build follows the pinned commit
          # either way, and the check below reports the move.
          PEELED=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}^{}" | cut -f1)
          PLAIN=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}" | cut -f1)
          echo "TAG_COMMIT=${PEELED:-$PLAIN}" >> "$GITHUB_ENV"
          echo "${{ matrix.tag }} → ${PEELED:-$PLAIN}"
      - name: Read the app's manifest paths from policy.yaml
        id: paths
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("sparse<<EOF")
          print("\n".join(yaml.safe_load(open("policy.yaml"))["app-data-paths"]))
          print("EOF")
          PY
      - name: Check out the app's manifest at ${{ matrix.commit }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: app-data
          sparse-checkout: ${{ steps.paths.outputs.sparse }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ matrix.day_version }}
      - name: Read the app's identity
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.flavor }}"
          # The catalog names a flavor; carrying one is the app's choice. Without
          # `Day-<flavor>.toml` the manifest is read as it stands, which is then the identity
          # the app publishes under.
          if [ -n "$FLAVOR" ] && [ -f "app-data/Day-$FLAVOR.toml" ]; then
            (cd app-data && "$DAY_BIN" --flavor "$FLAVOR" metadata --json) > metadata.json
          else
            (cd app-data && "$DAY_BIN" metadata --json) > metadata.json
          fi
      - name: Check it against the submission
        run: |
          python3 scripts/queue.py verify --app "${{ matrix.token }}" --metadata metadata.json \
            --tag-commit "${TAG_COMMIT:-}"

  # Stage A: the app's build, on a runner with no credentials.
  build:
    name: build ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, verify]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-app
        with:
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
          if-no-files-found: error

  # Stage B: what has to be true about the package before it is signed.
  validate:
    name: validate ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
      - uses: ./.github/actions/validate-package
        with:
          token: ${{ matrix.token }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          tag: ${{ matrix.tag }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
          allow-mismatch: ${{ inputs.allow-mismatch && 'true' || 'false' }}
          github-token: ${{ github.token }}

  # Stage C: signing and upload. This is the only job that can reach the secrets, and it runs the
  # day CLI, fastlane and the platform signing tools over an archive.
  publish:
    name: publish ${{ matrix.token }} → ${{ matrix.channel }}
    needs: [plan, validate]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    environment: store
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One submission at a time, so two merges in a minute cannot race each other into one
      # store record.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.publish-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
      - uses: ./.github/actions/sign-submit
        with:
          token: ${{ matrix.token }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          target: ${{ matrix.target }}
          channel: ${{ matrix.channel }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
          lane: ${{ matrix.lane }}
          keystore-b64: ${{ secrets.DAY_ANDROID_KEYSTORE_B64 || secrets.KEYSTORE_JKS }}
          keystore-properties-b64: ${{ secrets.KEYSTORE_PROPERTIES }}
          key-alias: ${{ secrets.DAY_ANDROID_KEY_ALIAS }}
          keystore-password: ${{ secrets.DAY_KS_PASS }}
          key-password: ${{ secrets.DAY_KEY_PASS }}
          play-json-key: ${{ secrets.DAY_PLAY_JSON_KEY || secrets.GOOGLE_PLAY_APIKEY }}
          apple-cert-p12: ${{ secrets.DAY_APPLE_CERT_P12 || secrets.APPLE_CERTIFICATES_P12 }}
          apple-cert-password: ${{ secrets.DAY_APPLE_CERT_PASSWORD || secrets.APPLE_CERTIFICATES_P12_PASSWORD }}
          # The name on the catalog's certificate. Apple has issued both "iPhone Distribution"
          # and "Apple Distribution" certificates over the years, and codesign matches the name.
          apple-identity: ${{ secrets.DAY_APPLE_IDENTITY || 'Apple Distribution' }}
          # The app id a profile is issued for, and the team that issues it. With these, the
          # profile is generated at signing time from the App Store Connect key, so the catalog
          # stores none.
          app-id: ${{ matrix.app_id }}
          apple-team: ${{ secrets.DAY_APPLE_TEAM }}
          # Empty for nearly every app: a profile is issued during the run. An app that needs a
          # particular one names the secret holding it in its submission.
          apple-profile-b64: ${{ matrix.profile_secret != '' && secrets[matrix.profile_secret] || '' }}
          asc-api-key-b64: ${{ secrets.APPLE_APPSTORE_APIKEY }}
          asc-key-id: ${{ secrets.DAY_ASC_KEY_ID }}
          asc-issuer: ${{ secrets.DAY_ASC_ISSUER }}
          asc-key-b64: ${{ secrets.DAY_ASC_KEY_B64 }}

  # Record the publication in the repository, so the catalog's state is a file.
  record:
    name: record ${{ matrix.token }}
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: record-state
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Write the publication into state/published.json
        run: |
          set -euo pipefail
          python3 scripts/queue.py record \
            --app "${{ matrix.token }}" \
            --tag "${{ matrix.tag }}" \
            --channels "${{ matrix.channels }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit it
        run: |
          set -euo pipefail
          git config user.name "appfair-bot"
          git config user.email "bot@appfair.org"
          git add state/published.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          # `paths: apps/**` on this workflow keeps this commit from starting another run.
          git commit -m "Record ${{ matrix.token }} ${{ matrix.tag }} as published"
          git push origin HEAD:main
