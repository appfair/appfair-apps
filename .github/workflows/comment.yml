# Posting the reviewer's summary on a pull request.
#
# pr.yml runs on `pull_request`, where a pull request opened from a fork gets a read-only token,
# so it cannot comment. This workflow runs after it, from the base branch, with a token that can.
# It downloads the summary that run produced and posts it. Nothing from the pull request is
# checked out here and none of its code runs.
name: review comment

on:
  workflow_run:
    workflows: ["pull request"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Take the summary from the pull request's run
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: review-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: review

      # No artifact means the pull request changed no submission, and there is nothing to say.
      - name: Post it, or rewrite the one already there
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR=$(tr -dc '0-9' < review/review-pr.txt || true)
          if [ -z "$PR" ]; then
            echo "::error::the summary carries no pull request number"
            exit 1
          fi
          if [ ! -s review/review.md ]; then
            echo "::error::the summary is empty"
            exit 1
          fi
          # One comment per pull request, found by the marker the summary begins with and
          # rewritten on every push, so the thread holds the current range and not a history of
          # every force-push.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- appfair-review -->")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@review/review.md > /dev/null
            echo "rewrote comment $EXISTING on #$PR"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@review/review.md > /dev/null
            echo "commented on #$PR"
          fi
