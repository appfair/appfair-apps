# Posts the review summary pr.yml produced. That workflow runs with a read-only token on a fork
# pull request, so the comment is posted here instead, from the base branch. Nothing from the
# pull request is checked out and none of its code runs.
name: review comment

on:
  workflow_run:
    workflows: ["pull request"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the summary
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: review-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: review

      # No artifact: the pull request changed no submission.
      - name: Post or update the comment
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR=$(tr -dc '0-9' < review/review-pr.txt || true)
          if [ -z "$PR" ]; then
            echo "::error::the summary carries no pull request number"
            exit 1
          fi
          if [ ! -s review/review.md ]; then
            echo "::error::the summary is empty"
            exit 1
          fi
          # One comment per pull request, found by the marker the summary starts with and
          # rewritten on every push.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- appfair-review -->")) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -F body=@review/review.md > /dev/null
            echo "rewrote comment $EXISTING on #$PR"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@review/review.md > /dev/null
            echo "commented on #$PR"
          fi
