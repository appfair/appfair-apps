# Posts the review summary pr.yml produced, for a pull request from a fork: that run holds a
# read-only token, so the comment is posted here instead, from the base branch, once the run has
# completed. A pull request from this repository's own branches posts its own summary as it
# runs. Nothing from the pull request is checked out and none of its code runs.
name: review comment

on:
  workflow_run:
    workflows: ["pull request"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: comment
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the summary
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: review-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: review

      # No artifact: the pull request changed no submission.
      - name: Read the pull request number
        id: pr
        if: steps.fetch.outcome == 'success'
        run: echo "number=$(tr -dc '0-9' < review/review-pr.txt)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/post-review
        if: steps.fetch.outcome == 'success'
        with:
          pr: ${{ steps.pr.outputs.number }}
          summary: review/review.md
          token: ${{ github.token }}
