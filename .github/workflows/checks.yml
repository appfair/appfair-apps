# This repository's own checks: the rules, the submissions, the workflows and the action calls.
# Runs on every change here, including changes to the rules themselves.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily: the actions these workflows call live in another repository and change under them.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the queue's selftest
        run: python3 scripts/queue.py selftest
      - name: Run the unit tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate every submission
        run: python3 scripts/queue.py validate --all
      - name: Parse the workflows and actions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          paths = sorted(pathlib.Path(".github/workflows").glob("*.yml"))
          paths += sorted(pathlib.Path(".github/actions").glob("*/action.yml"))
          for path in paths:
              try:
                  yaml.safe_load(path.read_text())
                  print(f"ok   {path}")
              except yaml.YAMLError as e:
                  bad += 1
                  print(f"::error file={path}::{e}")
          sys.exit(1 if bad else 0)
          PY
      - name: Check the action calls
        run: python3 scripts/queue.py wiring
      - name: Parse state/published.json
        run: python3 -c "import json; json.load(open('state/published.json'))"
