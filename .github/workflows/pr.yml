# A submission, checked the way a merge will check it, without the publishing.
#
# The stages are separate jobs because the boundary between them is a security boundary:
#
#   plan, verify   read this repository and the app's manifest; no app code, no secrets
#   build          checks the app out and runs its build; app code, no secrets
#   validate       reads what the build produced; no app code, no secrets
#
# The publish workflow adds a fourth stage that signs and uploads. It holds the secrets and, like
# validate, runs none of the app's code.
name: pull request

on:
  pull_request:
    paths:
      - apps/**
      - policy.yaml
      - scripts/**
      - .github/actions/**
      - .github/workflows/pr.yml

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which submissions this pull request touches, and whether they are well formed. One job
  # answers both, so a typo stops here instead of in a build matrix.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      count: ${{ steps.plan.outputs.count }}
      allow-mismatch: ${{ steps.label.outputs.allow }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the diff against the base branch is possible at all.
          fetch-depth: 0
      - name: The catalog's own rules
        run: python3 scripts/queue.py selftest
      - name: Every submission still parses
        run: python3 scripts/queue.py validate --all
      - name: Plan the submissions this pull request changes
        id: plan
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/queue.py plan --changed-from "origin/${{ github.base_ref }}"
      # Who is asking. Maintainership belongs to the app's repository, so this queries GitHub
      # instead of keeping a list here. It warns and passes: the reviewer who merges decides, and
      # a maintainer stepping in or an app changing hands are ordinary events.
      - name: Does the author maintain the app?
        if: steps.plan.outputs.count != '0'
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKENS=$(python3 -c "
          import json, os
          print(' '.join(e['token'] for e in json.loads(os.environ['MATRIX'])['include']))
          ")
          [ -n "$TOKENS" ] || exit 0
          # shellcheck disable=SC2086 # a deliberately word-split token list
          python3 scripts/queue.py authorize $TOKENS \
            --actor "${{ github.event.pull_request.user.login }}"
      # What a reviewer needs to read before approving: the range between the commit that is
      # published and the one this pull request proposes. The comment itself is posted by
      # comment.yml, because a pull request from a fork gets a read-only token here.
      - name: Summarize the source changes for a reviewer
        if: steps.plan.outputs.count != '0'
        # The summary is for the reviewer to read, so a failure to write it leaves the checks
        # alone.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/queue.py review --changed-from "origin/${{ github.base_ref }}" \
            --out review.md
          echo "${{ github.event.pull_request.number }}" > review-pr.txt
      - name: Keep the summary for the comment job
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: review-comment
          path: |
            review.md
            review-pr.txt
          if-no-files-found: ignore
      # The label that lets a submission past a comparison it cannot pass. A maintainer adds it
      # after finding out why the two builds differ, and the run records that it was used.
      - name: Was the comparison waived?
        id: label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          override = yaml.safe_load(open("policy.yaml"))["override-label"]
          labels = json.loads(os.environ["LABELS"])
          print("allow=" + ("true" if override in labels else "false"))
          PY

  # Whether the app at that commit is the app the file claims. Only the app's manifest can say,
  # so this job reads it through a sparse checkout that leaves the source behind.
  verify:
    name: verify ${{ matrix.token }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Does ${{ matrix.tag }} exist in ${{ matrix.repo }}?
        run: |
          set -euo pipefail
          # Checked before the checkout, so an unpushed tag or an unreadable repository is
          # reported directly instead of appearing as a checkout failure.
          if ! REF=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}" 2>&1); then
            echo "::error file=apps/${{ matrix.token }}.yaml::cannot read https://github.com/${{ matrix.repo }} — an app in the catalog has to be public ($REF)"
            exit 1
          fi
          if [ -z "$REF" ]; then
            echo "::error file=apps/${{ matrix.token }}.yaml::${{ matrix.repo }} has no tag ${{ matrix.tag }} — tag the release before submitting it"
            exit 1
          fi
          echo "$REF"
          # An annotated tag answers with its own object first and the commit under `^{}`, so
          # take the peeled line when there is one. The pin check reads this.
          PEELED=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}^{}" | cut -f1)
          echo "TAG_COMMIT=${PEELED:-$(printf '%s' "$REF" | head -1 | cut -f1)}" >> "$GITHUB_ENV"
      - name: Read the app's manifest paths from policy.yaml
        id: paths
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("sparse<<EOF")
          print("\n".join(yaml.safe_load(open("policy.yaml"))["app-data-paths"]))
          print("EOF")
          PY
      - name: Check out the app's manifest at ${{ matrix.commit }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: app-data
          sparse-checkout: ${{ steps.paths.outputs.sparse }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ matrix.day_version }}
      - name: Read the app's identity
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.flavor }}"
          # The catalog names a flavor; carrying one is the app's choice. Without
          # `Day-<flavor>.toml` the manifest is read as it stands, which is then the identity
          # the app publishes under.
          if [ -n "$FLAVOR" ] && [ -f "app-data/Day-$FLAVOR.toml" ]; then
            (cd app-data && "$DAY_BIN" --flavor "$FLAVOR" metadata --json) > metadata.json
          else
            (cd app-data && "$DAY_BIN" metadata --json) > metadata.json
          fi
          cat metadata.json
      - name: Check it against the submission
        run: |
          python3 scripts/queue.py verify --app "${{ matrix.token }}" --metadata metadata.json \
            --tag-commit "${TAG_COMMIT:-}"

  # Stage A. The one job here that runs code the app supplied: its build.rs, its Gradle and Xcode
  # build phases, whatever its dependencies do while building. It gets no secrets, and what it
  # produces is files.
  build:
    name: build ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, verify]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-app
        with:
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
          if-no-files-found: error

  # Stage B. Reads what stage A produced, the release the maintainer published from the same tag,
  # and the app's manifest. It runs on a runner that has never seen the app's source.
  validate:
    name: validate ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
      - uses: ./.github/actions/validate-package
        with:
          token: ${{ matrix.token }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          tag: ${{ matrix.tag }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
          allow-mismatch: ${{ needs.plan.outputs.allow-mismatch }}
          github-token: ${{ github.token }}
