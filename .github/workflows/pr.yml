# A submission, from its checks to the stores. The stages are separate jobs because the boundary
# between them is a security boundary:
#
#   plan, lint, verify   this repository and the app's manifest; no app code, no secrets
#   access               whether the catalog can attach to the app's release; no app code
#   build                runs the app's build; app code, no secrets
#   validate             reads what the build produced; no app code, no secrets
#   submit               signs, submits and attaches; secrets, no app code (submit.yml)
#   merge                merges this pull request, once the stores have taken it
#
# Everything up to `validate` runs on every push to the pull request. `submit` waits for a
# reviewer of the `store` environment, so a maintainer decides when a version goes out, and the
# pull request stays open until it has. Merging is the record of a publication rather than the
# thing that causes one.
name: pull request

on:
  pull_request:
    paths:
      - apps/**
      - policy.yaml
      - scripts/**
      - .github/actions/**
      - .github/workflows/pr.yml

permissions:
  contents: read

# One run per pull request: a push replaces the run before it, so a review reads one set of
# results. It also cancels a submission in flight, which is why the approval belongs at the end
# of a review rather than the start; a submission cancelled between two stores is finished
# through the publish workflow's `channel` input.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Which submissions this pull request touches, and whether they are well formed, so a typo
  # stops here instead of in a build matrix.
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      build-matrix: ${{ steps.plan.outputs.build-matrix }}
      publish-matrix: ${{ steps.plan.outputs.publish-matrix }}
      count: ${{ steps.plan.outputs.count }}
      allow-mismatch: ${{ steps.label.outputs.allow }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: the plan diffs against the base branch.
          fetch-depth: 0
      - name: Run the catalog's selftest
        run: python3 scripts/queue.py selftest
      - name: Validate every submission
        run: python3 scripts/queue.py validate --all
      - name: Plan the changed submissions
        id: plan
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          python3 scripts/queue.py plan --changed-from "origin/${{ github.base_ref }}"
      # Maintainership belongs to the app's repository, so this asks GitHub rather than keeping
      # a list here. It warns and passes; the reviewer who merges decides.
      - name: Check the author's maintainership
        if: steps.plan.outputs.count != '0'
        env:
          MATRIX: ${{ steps.plan.outputs.matrix }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOKENS=$(python3 -c "
          import json, os
          print(' '.join(e['token'] for e in json.loads(os.environ['MATRIX'])['include']))
          ")
          [ -n "$TOKENS" ] || exit 0
          # shellcheck disable=SC2086 # the tokens are separate arguments
          python3 scripts/queue.py authorize $TOKENS \
            --actor "${{ github.event.pull_request.user.login }}"
      # The range between the published commit and the proposed one, for the reviewer. Posted by
      # comment.yml, since a fork pull request gets a read-only token here. A failure to write it
      # leaves the checks alone.
      - name: Summarize the source changes
        if: steps.plan.outputs.count != '0'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/queue.py review --changed-from "origin/${{ github.base_ref }}" \
            --out review.md
          echo "${{ github.event.pull_request.number }}" > review-pr.txt
      - name: Upload the summary
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: review-comment
          path: |
            review.md
            review-pr.txt
          if-no-files-found: ignore
      # The label that waives a comparison a submission cannot pass. The run records its use.
      - name: Read the waiver label
        id: label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, yaml
          override = yaml.safe_load(open("policy.yaml"))["override-label"]
          labels = json.loads(os.environ["LABELS"])
          print("allow=" + ("true" if override in labels else "false"))
          PY

  # The catalog's rules for an app's repository: the licence texts, the licence notice in each
  # source file, the flavor manifest. Same action an app runs in its own CI. The checkout is full,
  # since the rules read the sources.
  lint:
    name: lint ${{ matrix.token }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: app
          persist-credentials: false
      - uses: ./.github/actions/appfair-lint
        with:
          path: app
          flavor: ${{ matrix.flavor }}

  # Whether the app at that commit is the app the file claims, read from its manifest through a
  # sparse checkout that leaves the source behind.
  verify:
    name: verify ${{ matrix.token }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve ${{ matrix.tag }} in ${{ matrix.repo }}
        run: |
          set -euo pipefail
          # Before the checkout, so an unpushed tag or a private repository is reported as
          # itself rather than as a checkout failure.
          if ! REF=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}" 2>&1); then
            echo "::error file=apps/${{ matrix.token }}.yaml::cannot read https://github.com/${{ matrix.repo }}; an app in the catalog has to be public ($REF)"
            exit 1
          fi
          if [ -z "$REF" ]; then
            echo "::error file=apps/${{ matrix.token }}.yaml::${{ matrix.repo }} has no tag ${{ matrix.tag }}; tag the release before submitting it"
            exit 1
          fi
          echo "$REF"
          # An annotated tag lists its object first and the commit under `^{}`; the pin check
          # wants the peeled line.
          PEELED=$(git ls-remote --tags "https://github.com/${{ matrix.repo }}" "refs/tags/${{ matrix.tag }}^{}" | cut -f1)
          echo "TAG_COMMIT=${PEELED:-$(printf '%s' "$REF" | head -1 | cut -f1)}" >> "$GITHUB_ENV"
      - name: Read the manifest paths
        id: paths
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          print("sparse<<EOF")
          print("\n".join(yaml.safe_load(open("policy.yaml"))["app-data-paths"]))
          print("EOF")
          PY
      - name: Check out the app's manifest
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          path: app-data
          sparse-checkout: ${{ steps.paths.outputs.sparse }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: daybrite/actions/.github/actions/setup-day-cli@main
        with:
          version: ${{ matrix.day_version }}
      - name: Read the app's metadata
        run: |
          set -euo pipefail
          FLAVOR="${{ matrix.flavor }}"
          # The catalog names a flavor; carrying one is the app's choice. Without
          # `Day-<flavor>.toml` the manifest is read as it stands.
          if [ -n "$FLAVOR" ] && [ -f "app-data/Day-$FLAVOR.toml" ]; then
            (cd app-data && "$DAY_BIN" --flavor "$FLAVOR" metadata --json) > metadata.json
          else
            (cd app-data && "$DAY_BIN" metadata --json) > metadata.json
          fi
          cat metadata.json
      - name: Verify the submission
        run: |
          python3 scripts/queue.py verify --app "${{ matrix.token }}" --metadata metadata.json \
            --tag-commit "${TAG_COMMIT:-}"

  # Stage A. The only job that runs the app's code: its build.rs, its Gradle and Xcode phases,
  # its dependencies. No secrets reach it, and it produces files.
  build:
    name: build ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, lint, verify]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-app
        with:
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
          if-no-files-found: error

  # Stage B, on a runner that never saw the app's source: what stage A produced, the maintainer's
  # release of the same tag, and the app's manifest.
  validate:
    name: validate ${{ matrix.token }} ${{ matrix.target }}
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.token }}-${{ matrix.target }}
          path: packages
      - uses: ./.github/actions/validate-package
        with:
          token: ${{ matrix.token }}
          repo: ${{ matrix.repo }}
          ref: ${{ matrix.commit }}
          tag: ${{ matrix.tag }}
          target: ${{ matrix.target }}
          flavor: ${{ matrix.flavor }}
          day-version: ${{ matrix.day_version }}
          allow-mismatch: ${{ needs.plan.outputs.allow-mismatch }}
          github-token: ${{ github.token }}

  # Stage C, the submission itself, in submit.yml so this and publish.yml run the same one. The
  # `store` environment its publish job declares is where a maintainer approves: until someone
  # with that environment's review does, this job waits and the pull request stays open.
  submit:
    needs: [plan, lint, verify, validate]
    if: needs.plan.outputs.count != '0'
    uses: ./.github/workflows/submit.yml
    secrets: inherit
    with:
      matrix: ${{ needs.plan.outputs.matrix }}
      publish-matrix: ${{ needs.plan.outputs.publish-matrix }}

  # The stores have the build, and its packages are on the app's release: the submission is done,
  # and merging is how the catalog records it. A failed channel leaves the pull request open with
  # its failure on it, to re-run once the cause is fixed.
  merge:
    name: merge
    needs: [plan, submit]
    if: ${{ !cancelled() && needs.submit.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: record-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Merge this pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr merge "${{ github.event.pull_request.number }}" --squash --delete-branch \
            --subject "${{ github.event.pull_request.title }}" \
            --body "Published from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      # On `main`, which now carries the submissions this run published.
      - name: Record the publication
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 scripts/queue.py record --matrix "$MATRIX" --run-url "$RUN_URL"
          git config user.name "appfair-bot"
          git config user.email "bot@appfair.org"
          git add state/published.json
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "Record what run ${{ github.run_id }} published"
          git push origin HEAD:main
