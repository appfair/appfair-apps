name: Sign and submit a validated package
description: >-
  Stage C. Put the App Fair's signature on a package that stage B has already read, and hand it to
  the store. The key material comes from this repository's secrets and is named on the command
  line, so nothing the app declares decides what is read. No app code runs here: the package is
  re-signed as an archive, and the listing is staged from the app's text and images.

inputs:
  token:
    description: The app token.
    required: true
  repo:
    description: The app's repository, as owner/name.
    required: true
  ref:
    description: The tag being published.
    required: true
  target:
    description: ios-uikit or android-mdc.
    required: true
  flavor:
    description: The Day build flavor the submission names.
    required: false
    default: appfair
  packages:
    description: The directory holding the packages stage A built.
    required: false
    default: packages
  lane:
    description: The fastlane lane to run, such as "android upload" or "ios release".
    required: true
  day-version:
    description: Which day CLI signs and stages.
    required: false
    default: main
  # --- the App Fair's own material ---------------------------------------------------------
  keystore-b64:
    description: Base64 Play upload keystore.
    required: false
  key-alias:
    description: The key alias inside that keystore.
    required: false
  keystore-password:
    description: The keystore password.
    required: false
  key-password:
    description: The key password.
    required: false
  play-json-key:
    description: The Google Play service-account JSON.
    required: false
  apple-cert-p12:
    description: Base64 iOS distribution certificate (.p12).
    required: false
  apple-cert-password:
    description: The password for that certificate.
    required: false
  apple-profile-b64:
    description: Base64 App Store provisioning profile for this app.
    required: false
  apple-identity:
    description: The signing identity to use, by name.
    required: false
    default: Apple Distribution
  asc-key-id:
    description: App Store Connect API key id.
    required: false
  asc-issuer:
    description: App Store Connect issuer id.
    required: false
  asc-key-b64:
    description: Base64 App Store Connect API key (.p8).
    required: false

runs:
  using: composite
  steps:
    - uses: daybrite/actions/.github/actions/setup-day-cli@main
      with:
        version: ${{ inputs.day-version }}

    - name: Name the package
      id: pick
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          android-mdc) package=$(ls "${{ inputs.packages }}"/*.aab | head -1) ;;
          ios-uikit)   package=$(ls "${{ inputs.packages }}"/*.ipa | head -1) ;;
          *) echo "::error::unknown target ${{ inputs.target }}"; exit 1 ;;
        esac
        [ -n "$package" ] || { echo "::error::no package for ${{ inputs.target }}"; exit 1; }
        echo "package=$PWD/$package" >> "$GITHUB_OUTPUT"

    # --- Android ---------------------------------------------------------------------------
    - name: Sign the .aab with the App Fair's upload key
      if: inputs.target == 'android-mdc'
      shell: bash
      env:
        KEYSTORE_B64: ${{ inputs.keystore-b64 }}
        DAY_SIGN_STORE_PASS: ${{ inputs.keystore-password }}
        DAY_SIGN_KEY_PASS: ${{ inputs.key-password }}
      run: |
        set -euo pipefail
        [ -n "${KEYSTORE_B64:-}" ] || { echo "::error::no Play upload keystore in this repository's secrets"; exit 1; }
        echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
        # Signed in a directory holding the package alone: `day sign apply` takes the key on the
        # command line, so the app's own [signing] tables are never read and cannot decide which
        # of this runner's variables are looked up.
        "$DAY_BIN" sign apply "${{ steps.pick.outputs.package }}" \
          --keystore "$RUNNER_TEMP/upload.keystore" \
          --key-alias "${{ inputs.key-alias }}"

    # --- Apple -----------------------------------------------------------------------------
    - name: Import the App Fair's distribution certificate
      if: inputs.target == 'ios-uikit'
      shell: bash
      env:
        CERT_P12: ${{ inputs.apple-cert-p12 }}
        CERT_PASSWORD: ${{ inputs.apple-cert-password }}
        PROFILE_B64: ${{ inputs.apple-profile-b64 }}
      run: |
        set -euo pipefail
        [ -n "${CERT_P12:-}" ] || { echo "::error::no iOS distribution certificate in this repository's secrets"; exit 1; }
        [ -n "${PROFILE_B64:-}" ] || { echo "::error::no provisioning profile for this app; store one and name it in apps/${{ inputs.token }}.yaml"; exit 1; }
        KEYCHAIN="$RUNNER_TEMP/appfair.keychain-db"
        PASSWORD="$(openssl rand -hex 24)"
        security create-keychain -p "$PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
        echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/dist.p12"
        echo "$PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/appstore.mobileprovision"
        security find-identity -v -p codesigning "$KEYCHAIN"

    - name: Sign the .ipa with the App Fair's identity
      if: inputs.target == 'ios-uikit'
      shell: bash
      run: |
        set -euo pipefail
        # The profile and the identity are named outright, so the app's [signing.ios] table is
        # never consulted.
        "$DAY_BIN" sign apply "${{ steps.pick.outputs.package }}" \
          --profile "$RUNNER_TEMP/appstore.mobileprovision" \
          --identity "${{ inputs.apple-identity }}"

    # --- The listing, staged from the app's text and images ---------------------------------
    - name: Read the app's manifest paths from policy.yaml
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import yaml
        paths = yaml.safe_load(open("policy.yaml"))["app-data-paths"]
        print("sparse<<EOF")
        print("\n".join(paths))
        print("EOF")
        PY

    - name: Check out the app's listing at ${{ inputs.ref }}
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: app-data
        sparse-checkout: ${{ steps.paths.outputs.sparse }}
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Stage the listing
      shell: bash
      run: |
        set -euo pipefail
        # `day store stage` writes the fastlane tree from the listing's text files. The Fastfile
        # it writes is day's own; the app supplies the words and the screenshots.
        (cd app-data && "$DAY_BIN" --flavor "${{ inputs.flavor }}" store stage)
        find app-data/build/day/store -maxdepth 3 -type d | head -20

    - name: Upload to the store (${{ inputs.lane }})
      shell: bash
      working-directory: app-data/build/day/store/${{ inputs.target }}
      env:
        DAY_AAB: ${{ inputs.target == 'android-mdc' && steps.pick.outputs.package || '' }}
        DAY_IPA: ${{ inputs.target == 'ios-uikit' && steps.pick.outputs.package || '' }}
        DAY_ASC_KEY_ID: ${{ inputs.asc-key-id }}
        DAY_ASC_ISSUER: ${{ inputs.asc-issuer }}
        ASC_KEY_B64: ${{ inputs.asc-key-b64 }}
        PLAY_JSON_KEY: ${{ inputs.play-json-key }}
      run: |
        set -euo pipefail
        if [ -n "${ASC_KEY_B64:-}" ]; then
          echo "$ASC_KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          export DAY_ASC_KEY="$RUNNER_TEMP/asc.p8"
        fi
        if [ -n "${PLAY_JSON_KEY:-}" ]; then
          printf '%s' "$PLAY_JSON_KEY" > "$RUNNER_TEMP/play.json"
          export SUPPLY_JSON_KEY="$RUNNER_TEMP/play.json"
        fi
        read -ra lane <<< "${{ inputs.lane }}"   # "android upload" is two fastlane arguments
        command -v fastlane >/dev/null || sudo gem install fastlane --no-document
        fastlane "${lane[@]}"

    - name: Keep the signed package
      uses: actions/upload-artifact@v7
      with:
        name: published-${{ inputs.token }}-${{ inputs.target }}
        path: ${{ inputs.packages }}
        if-no-files-found: error
