name: Sign and submit a validated package
description: >-
  Stage C. Sign a package stage B has already read, and upload it. The key material comes from
  this repository's secrets and is named on the command line, so the app's own manifest does not
  decide which credentials are read. The package is re-signed as an archive and the listing is
  staged from the app's text and images, so none of the app's code runs.

inputs:
  token:
    description: The app token.
    required: true
  repo:
    description: The app's repository, as owner/name.
    required: true
  ref:
    description: The tag being published.
    required: true
  target:
    description: The Day target whose package this is — ios-uikit or android-mdc.
    required: true
  channel:
    description: >-
      Where it is going: apple-app-store, google-play-store, or another channel policy.yaml
      declares. The signing follows the target; the upload follows the channel.
    required: true
  flavor:
    description: The Day build flavor the submission names.
    required: false
    default: appfair
  packages:
    description: The directory holding the packages stage A built.
    required: false
    default: packages
  lane:
    description: The fastlane lane to run, such as "android upload" or "ios release".
    required: true
  day-version:
    description: Which day CLI signs and stages.
    required: false
    default: main
  # Two of the organization's existing secrets carry several of the fields below at once. An
  # explicit field wins over the bundle that duplicates it, so a catalog can move to the newer
  # names one secret at a time.
  keystore-properties-b64:
    description: Base64 Java properties holding keyAlias, storePassword and keyPassword.
    required: false
  asc-api-key-b64:
    description: >-
      Base64 fastlane App Store Connect key file, holding `key_id`, `issuer_id` and `key`. It
      supplies the three App Store Connect fields at once.
    required: false
  # --- the App Fair's own material ---------------------------------------------------------
  keystore-b64:
    description: Base64 Play upload keystore.
    required: false
  key-alias:
    description: The key alias inside that keystore.
    required: false
  keystore-password:
    description: The keystore password.
    required: false
  key-password:
    description: The key password.
    required: false
  play-json-key:
    description: The Google Play service-account JSON, plain or base64.
    required: false
  apple-cert-p12:
    description: Base64 iOS distribution certificate (.p12).
    required: false
  apple-cert-password:
    description: The password for that certificate.
    required: false
  app-id:
    description: The bundle id being published; profiles are issued per bundle id.
    required: false
  apple-team:
    description: The Apple Developer team id the App Store Connect key belongs to.
    required: false
  apple-profile-b64:
    description: >-
      Base64 App Store provisioning profile, for an app that needs a particular one. Left empty,
      the profile is requested from Apple at signing time, so the catalog stores none per app.
    required: false
  apple-identity:
    description: >-
      The signing identity to sign with, by name or SHA-1. `codesign` matches a name as a prefix,
      so "iPhone Distribution: …" and "Apple Distribution: …" are different identities and the
      catalog's certificate decides which of them this is.
    required: false
    default: Apple Distribution
  asc-key-id:
    description: App Store Connect API key id.
    required: false
  asc-issuer:
    description: App Store Connect issuer id.
    required: false
  asc-key-b64:
    description: Base64 App Store Connect API key (.p8).
    required: false

runs:
  using: composite
  steps:
    - uses: daybrite/actions/.github/actions/setup-day-cli@main
      with:
        version: ${{ inputs.day-version }}

    # The steps below read policy.yaml with PyYAML. Ubuntu runners ship a python3 that has it;
    # macOS runners do not, and the first `import yaml` is where the job would otherwise stop.
    - name: The python packages the queue's scripts need
      shell: bash
      run: |
        set -euo pipefail
        # PyYAML reads policy.yaml; cryptography signs the App Store Connect token the
        # confirmation below asks with. Ubuntu runners have the first, macOS runners neither.
        for module in yaml cryptography; do
          python3 -c "import $module" 2>/dev/null && continue
          package=$([ "$module" = yaml ] && echo pyyaml || echo cryptography)
          # --break-system-packages for a Homebrew python that marks itself externally managed.
          pip3 install --quiet --disable-pip-version-check "$package" \
            || pip3 install --quiet --disable-pip-version-check --break-system-packages "$package"
        done
        python3 -c "import sys, yaml, cryptography; print('python', sys.version.split()[0], '| PyYAML', yaml.__version__, '| cryptography', cryptography.__version__)"

    - name: Normalize the signing inputs
      shell: bash
      env:
        KEYSTORE_PROPERTIES_B64: ${{ inputs.keystore-properties-b64 }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        STORE_PASS: ${{ inputs.keystore-password }}
        KEY_PASS: ${{ inputs.key-password }}
        PLAY_KEY: ${{ inputs.play-json-key }}
        ASC_API_KEY_B64: ${{ inputs.asc-api-key-b64 }}
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER: ${{ inputs.asc-issuer }}
        ASC_KEY_B64: ${{ inputs.asc-key-b64 }}
      run: python3 scripts/signing_inputs.py

    - name: Name the package
      id: pick
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          android-mdc) package=$(ls "${{ inputs.packages }}"/*.aab | head -1) ;;
          ios-uikit)   package=$(ls "${{ inputs.packages }}"/*.ipa | head -1) ;;
          *) echo "::error::unknown target ${{ inputs.target }}"; exit 1 ;;
        esac
        [ -n "$package" ] || { echo "::error::no package for ${{ inputs.target }}"; exit 1; }
        echo "package=$PWD/$package" >> "$GITHUB_OUTPUT"

    # --- Android ---------------------------------------------------------------------------
    - name: Sign the .aab with the App Fair's upload key
      if: inputs.target == 'android-mdc'
      shell: bash
      env:
        KEYSTORE_B64: ${{ inputs.keystore-b64 }}
      run: |
        set -euo pipefail
        [ -n "${KEYSTORE_B64:-}" ] || { echo "::error::no Play upload keystore in this repository's secrets"; exit 1; }
        echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
        # `day sign apply` takes the key on the command line, so the app's [signing] tables are
        # not read and cannot influence which of this runner's variables are used.
        "$DAY_BIN" sign apply "${{ steps.pick.outputs.package }}" \
          --keystore "$RUNNER_TEMP/upload.keystore" \
          --key-alias "$APPFAIR_KEY_ALIAS"

    # --- Apple -----------------------------------------------------------------------------
    - name: Import the App Fair's distribution certificate
      if: inputs.target == 'ios-uikit'
      shell: bash
      env:
        CERT_P12: ${{ inputs.apple-cert-p12 }}
        CERT_PASSWORD: ${{ inputs.apple-cert-password }}
      run: |
        set -euo pipefail
        [ -n "${CERT_P12:-}" ] || { echo "::error::no iOS distribution certificate in this repository's secrets"; exit 1; }
        KEYCHAIN="$RUNNER_TEMP/appfair.keychain-db"
        PASSWORD="$(openssl rand -hex 24)"
        security create-keychain -p "$PASSWORD" "$KEYCHAIN"
        security set-keychain-settings -lut 3600 "$KEYCHAIN"
        security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
        echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
        chmod 600 "$RUNNER_TEMP/dist.p12"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
        security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/dist.p12"
        security find-identity -v -p codesigning "$KEYCHAIN"
        # Compare against the imported certificate, so a mismatch is reported here instead of as
        # codesign's "no identity found" later in the run.
        security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "${{ inputs.apple-identity }}" || {
          echo "::error::the imported certificate is not \"${{ inputs.apple-identity }}\" — set DAY_APPLE_IDENTITY to the name above"
          exit 1
        }

    - name: The App Store profile for ${{ inputs.app-id }}
      if: inputs.target == 'ios-uikit'
      shell: bash
      env:
        # fastlane reports usage to its own servers unless told not to.
        FASTLANE_OPT_OUT_USAGE: "1"
        PROFILE_B64: ${{ inputs.apple-profile-b64 }}
        ASC_KEY_ID: ${{ env.APPFAIR_ASC_KEY_ID }}
        ASC_ISSUER: ${{ env.APPFAIR_ASC_ISSUER }}
        ASC_KEY_PATH: ${{ env.APPFAIR_ASC_KEY_PATH }}
        APPLE_TEAM: ${{ inputs.apple-team }}
        APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        DEST="$RUNNER_TEMP/appstore.mobileprovision"

        # A stored profile wins, for an app that needs a particular one.
        if [ -n "${PROFILE_B64:-}" ]; then
          echo "$PROFILE_B64" | base64 --decode > "$DEST"
          echo "using the stored profile"
        else
          # Otherwise Apple issues one now for this app id, against the certificate imported
          # above, so no profile is stored or renewed here.
          [ -n "${ASC_KEY_ID:-}" ] && [ -n "${ASC_ISSUER:-}" ] && [ -s "${ASC_KEY_PATH:-}" ] || {
            echo "::error::no App Store Connect key, so no profile can be issued for $APP_ID"
            exit 1
          }
          [ -n "${APP_ID:-}" ] || { echo "::error::no app id to issue a profile for"; exit 1; }
          # fastlane's API-key file, written where only this job can read it.
          python3 -c 'import json, os, pathlib; print(json.dumps({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER"], "key": pathlib.Path(os.environ["ASC_KEY_PATH"]).read_text(), "in_house": False}))' > "$RUNNER_TEMP/asc-key.json"
          chmod 600 "$RUNNER_TEMP/asc-key.json"
          command -v fastlane >/dev/null || sudo gem install fastlane --no-document
          # `--force` regenerates the profile, so it carries the certificate this run signs
          # with.
          fastlane sigh \
            --api_key_path "$RUNNER_TEMP/asc-key.json" \
            --app_identifier "$APP_ID" \
            ${APPLE_TEAM:+--team_id "$APPLE_TEAM"} \
            --platform ios \
            --force \
            --output_path "$RUNNER_TEMP/profiles" \
            --filename appstore.mobileprovision
          mv "$RUNNER_TEMP/profiles/appstore.mobileprovision" "$DEST"
          rm -f "$RUNNER_TEMP/asc-key.json"
        fi
        # Print what the profile is, for reading against a later signing failure.
        security cms -D -i "$DEST" | plutil -p - | grep -E '"(Name|UUID|TeamIdentifier|ExpirationDate)"' || true

    - name: Sign the .ipa with the App Fair's identity
      if: inputs.target == 'ios-uikit'
      shell: bash
      run: |
        set -euo pipefail
        # The profile and identity are given explicitly, so the app's [signing.ios] table is not
        # read.
        "$DAY_BIN" sign apply "${{ steps.pick.outputs.package }}" \
          --profile "$RUNNER_TEMP/appstore.mobileprovision" \
          --identity "${{ inputs.apple-identity }}"

    # --- The listing, staged from the app's text and images ---------------------------------
    - name: Read the app's manifest paths from policy.yaml
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import yaml
        paths = yaml.safe_load(open("policy.yaml"))["app-data-paths"]
        print("sparse<<EOF")
        print("\n".join(paths))
        print("EOF")
        PY

    - name: Check out the app's listing at ${{ inputs.ref }}
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: app-data
        sparse-checkout: ${{ steps.paths.outputs.sparse }}
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - name: Stage the listing
      shell: bash
      run: |
        set -euo pipefail
        # `day store stage` generates the fastlane tree from the listing's text files. The
        # Fastfile comes from day; the app supplies the copy and the screenshots.
        (cd app-data && "$DAY_BIN" --flavor "${{ inputs.flavor }}" store stage)
        find app-data/build/day/store -maxdepth 3 -type d | head -20

    - name: Upload to ${{ inputs.channel }} (${{ inputs.lane }})
      shell: bash
      working-directory: app-data/build/day/store/${{ inputs.target }}
      env:
        FASTLANE_OPT_OUT_USAGE: "1"
        DAY_AAB: ${{ inputs.target == 'android-mdc' && steps.pick.outputs.package || '' }}
        DAY_IPA: ${{ inputs.target == 'ios-uikit' && steps.pick.outputs.package || '' }}
        DAY_ASC_KEY_ID: ${{ env.APPFAIR_ASC_KEY_ID }}
        DAY_ASC_ISSUER: ${{ env.APPFAIR_ASC_ISSUER }}
        DAY_ASC_KEY: ${{ env.APPFAIR_ASC_KEY_PATH }}
        SUPPLY_JSON_KEY: ${{ env.APPFAIR_PLAY_KEY_PATH }}
      run: |
        set -euo pipefail
        case "${{ inputs.channel }}" in
          apple-app-store|google-play-store) ;;
          *) echo "::error::${{ inputs.channel }} has no arm here yet — policy.yaml declares it, and this action has to learn it"; exit 1 ;;
        esac
        read -ra lane <<< "${{ inputs.lane }}"   # "android upload" is two fastlane arguments
        command -v fastlane >/dev/null || sudo gem install fastlane --no-document
        fastlane "${lane[@]}"

    # An upload and a submission are not the same thing: `deliver` finishes happily having sent a
    # binary, while the version it belongs to can still be sitting in Prepare for Submission with
    # nothing attached. Ask App Store Connect what the records say, and fail when they do not say
    # what this run claimed.
    - name: Confirm the submission with Google Play
      if: inputs.channel == 'google-play-store'
      shell: bash
      env:
        APPFAIR_PLAY_KEY_PATH: ${{ env.APPFAIR_PLAY_KEY_PATH }}
      run: |
        set -euo pipefail
        (cd app-data && "$DAY_BIN" --flavor "${{ inputs.flavor }}" metadata --json) \
          > submitted-metadata.json 2>/dev/null
        # The lane decides which track to look in, and what the release there has to be.
        case "${{ inputs.lane }}" in
          *release) TRACK=production; EXPECT=submitted ;;
          *) TRACK=internal; EXPECT=uploaded ;;
        esac
        python3 scripts/play_state.py --metadata submitted-metadata.json \
          --target "${{ inputs.target }}" --track "$TRACK" --expect "$EXPECT"

    - name: Confirm the submission with App Store Connect
      if: inputs.channel == 'apple-app-store'
      shell: bash
      env:
        APPFAIR_ASC_KEY_ID: ${{ env.APPFAIR_ASC_KEY_ID }}
        APPFAIR_ASC_ISSUER: ${{ env.APPFAIR_ASC_ISSUER }}
        APPFAIR_ASC_KEY_PATH: ${{ env.APPFAIR_ASC_KEY_PATH }}
      run: |
        set -euo pipefail
        (cd app-data && "$DAY_BIN" --flavor "${{ inputs.flavor }}" metadata --json) \
          > submitted-metadata.json 2>/dev/null
        # A lane that submits has to end with the version submitted; one that only uploads is
        # allowed to leave it in Prepare for Submission, and says so.
        case "${{ inputs.lane }}" in
          *release|*submit) EXPECT=submitted ;;
          *) EXPECT=uploaded ;;
        esac
        python3 scripts/asc_state.py --bundle-id "${{ inputs.app-id }}" \
          --metadata submitted-metadata.json --target "${{ inputs.target }}" --expect "$EXPECT"

    - name: Keep the signed package
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: published-${{ inputs.token }}-${{ inputs.channel }}
        path: ${{ inputs.packages }}
        if-no-files-found: error
