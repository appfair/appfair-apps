name: Sign and submit a validated package
description: >-
  Stage C: sign a package stage B has read, and upload it. The keys come from this repository's
  secrets and are named on the command line, so the app's manifest cannot choose them. The
  package is re-signed as an archive, so none of the app's code runs. The signing and the upload
  are daybrite/actions' `sign-package` and `store-upload`, the same actions the shared
  `dayapp.yml` workflow releases with; this action wraps them in the queue's own checks.

inputs:
  token:
    description: The app token.
    required: true
  repo:
    description: The app's repository, as owner/name.
    required: true
  ref:
    description: The tag being published.
    required: true
  target:
    description: The Day target whose package this is, ios-uikit or android-mdc.
    required: true
  channel:
    description: >-
      Where it goes: apple-app-store, google-play-store, or another channel policy.yaml declares.
      The signing follows the target, the upload follows the channel.
    required: true
  flavor:
    description: The build flavor the catalog names, used when the app carries its manifest.
    required: false
    default: appfair
  packages:
    description: The directory holding the packages stage A built.
    required: false
    default: packages
  lane:
    description: The fastlane lane to run, such as "android upload" or "ios release".
    required: true
  screenshots:
    description: >-
      The listing's capture tree, with gallery.json at its root: what `queue.py listing` cut
      out of the release's screenshots.zip and the verify stage kept as this run's
      `listing-<token>` artifact. The same files the reviewer was shown go to the store. Empty
      stages the listing without screenshots, and each store keeps what it shows today.
    required: false
    default: ""
  day-version:
    description: Which day CLI signs and stages.
    required: false
    default: main
  # Two older secrets carry several fields at once. An explicit field wins over the bundle that
  # duplicates it, so a catalog can move to the newer names one secret at a time.
  keystore-properties-b64:
    description: Base64 Java properties holding keyAlias, storePassword and keyPassword.
    required: false
  asc-api-key-b64:
    description: >-
      Base64 fastlane App Store Connect key file, holding `key_id`, `issuer_id` and `key`. It
      supplies the three App Store Connect fields at once.
    required: false
  # --- the App Fair's key material ----------------------------------------------------------
  keystore-b64:
    description: Base64 Play upload keystore.
    required: false
  key-alias:
    description: The key alias inside that keystore.
    required: false
  keystore-password:
    description: The keystore password.
    required: false
  key-password:
    description: The key password.
    required: false
  play-json-key:
    description: The Google Play service-account JSON, plain or base64.
    required: false
  apple-cert-p12:
    description: Base64 iOS distribution certificate (.p12).
    required: false
  apple-cert-password:
    description: The password for that certificate.
    required: false
  app-id:
    description: >-
      The bundle id the catalog expects, used as a fallback. The id published under, and the one
      a profile is issued for, comes from the app's manifest.
    required: false
  apple-team:
    description: The Apple Developer team id the App Store Connect key belongs to.
    required: false
  apple-profile-b64:
    description: >-
      Base64 App Store provisioning profile, for an app that needs a particular one. Left empty,
      the profile is requested from Apple at signing time, so the catalog stores none per app.
    required: false
  apple-identity:
    description: >-
      The signing identity to sign with, by name or SHA-1. `codesign` matches a name as a prefix,
      so "iPhone Distribution: …" and "Apple Distribution: …" are different identities and the
      catalog's certificate decides which of them this is.
    required: false
    default: Apple Distribution
  asc-key-id:
    description: App Store Connect API key id.
    required: false
  asc-issuer:
    description: App Store Connect issuer id.
    required: false
  asc-key-b64:
    description: Base64 App Store Connect API key (.p8).
    required: false

runs:
  using: composite
  steps:
    - uses: daybrite/actions/.github/actions/setup-day-cli@main
      with:
        version: ${{ inputs.day-version }}

    # The steps below read policy.yaml with PyYAML. Ubuntu runners ship a python3 that has it;
    # macOS runners do not, and the first `import yaml` is where the job would otherwise stop.
    - name: Install Python dependencies
      shell: bash
      run: |
        set -euo pipefail
        # PyYAML reads policy.yaml; cryptography signs the App Store Connect token the
        # confirmation below asks with. Ubuntu runners have the first, macOS runners neither.
        for module in yaml cryptography; do
          python3 -c "import $module" 2>/dev/null && continue
          package=$([ "$module" = yaml ] && echo pyyaml || echo cryptography)
          # --break-system-packages for a Homebrew python that marks itself externally managed.
          pip3 install --quiet --disable-pip-version-check "$package" \
            || pip3 install --quiet --disable-pip-version-check --break-system-packages "$package"
        done
        python3 -c "import sys, yaml, cryptography; print('python', sys.version.split()[0], '| PyYAML', yaml.__version__, '| cryptography', cryptography.__version__)"

    - name: Normalize the signing inputs
      shell: bash
      env:
        KEYSTORE_PROPERTIES_B64: ${{ inputs.keystore-properties-b64 }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        STORE_PASS: ${{ inputs.keystore-password }}
        KEY_PASS: ${{ inputs.key-password }}
        PLAY_KEY: ${{ inputs.play-json-key }}
        ASC_API_KEY_B64: ${{ inputs.asc-api-key-b64 }}
        ASC_KEY_ID: ${{ inputs.asc-key-id }}
        ASC_ISSUER: ${{ inputs.asc-issuer }}
        ASC_KEY_B64: ${{ inputs.asc-key-b64 }}
      run: python3 scripts/signing_inputs.py

    - name: Read the manifest paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import yaml
        paths = yaml.safe_load(open("policy.yaml"))["app-data-paths"]
        print("sparse<<EOF")
        print("\n".join(paths))
        print("EOF")
        PY

    - name: Check out the app's listing
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: app-data
        sparse-checkout: ${{ steps.paths.outputs.sparse }}
        sparse-checkout-cone-mode: false
        persist-credentials: false

    # A version code Play has seen, or a version App Store Connect will not review, fails here
    # rather than after a signature and an upload.
    - name: Resolve the build flavor
      id: flavor
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
      run: |
        set -euo pipefail
        # Without `Day-<flavor>.toml` the manifest is read as it stands.
        if [ -n "$FLAVOR" ] && [ -f "app-data/Day-$FLAVOR.toml" ]; then
          echo "args=--flavor $FLAVOR" >> "$GITHUB_OUTPUT"
        else
          echo "args=" >> "$GITHUB_OUTPUT"
          echo "reading ${{ inputs.repo }}'s manifest as it stands${FLAVOR:+ (it carries no Day-$FLAVOR.toml)}"
        fi

    - name: Check what the store holds
      shell: bash
      env:
        FLAVOR_ARGS: ${{ steps.flavor.outputs.args }}
        APPFAIR_ASC_KEY_ID: ${{ env.APPFAIR_ASC_KEY_ID }}
        APPFAIR_ASC_ISSUER: ${{ env.APPFAIR_ASC_ISSUER }}
        APPFAIR_ASC_KEY_PATH: ${{ env.APPFAIR_ASC_KEY_PATH }}
        APPFAIR_PLAY_KEY_PATH: ${{ env.APPFAIR_PLAY_KEY_PATH }}
      run: |
        set -euo pipefail
        (cd app-data && "$DAY_BIN" $FLAVOR_ARGS metadata --json) \
          > submitted-metadata.json 2>/dev/null
        # The id published under is the one the app's manifest states; the catalog's `app_id`
        # is the fallback. The later steps read this back.
        APP_ID=$(python3 -c 'import json,sys; p=json.load(open("submitted-metadata.json"))["project"]; r=p.get("resolved",{}).get(sys.argv[1],{}); print(r.get("id") or p.get("id") or "")' "${{ inputs.target }}")
        [ -n "$APP_ID" ] || { echo "::error::the app manifest states no id for ${{ inputs.target }}"; exit 1; }
        echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
        echo "publishing as $APP_ID"
        case "${{ inputs.channel }}" in
          apple-app-store)
            python3 scripts/asc_state.py \
              --metadata submitted-metadata.json --target "${{ inputs.target }}" --preflight ;;
          google-play-store)
            python3 scripts/play_state.py --metadata submitted-metadata.json \
              --target "${{ inputs.target }}" --preflight ;;
        esac

    - name: Select the package
      id: pick
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          android-mdc) package=$(ls "${{ inputs.packages }}"/*.aab | head -1) ;;
          ios-uikit)   package=$(ls "${{ inputs.packages }}"/*.ipa | head -1) ;;
          *) echo "::error::unknown target ${{ inputs.target }}"; exit 1 ;;
        esac
        [ -n "$package" ] || { echo "::error::no package for ${{ inputs.target }}"; exit 1; }
        echo "package=$PWD/$package" >> "$GITHUB_OUTPUT"

    # --- Sign, with the shared action -------------------------------------------------------
    # daybrite/actions' `sign-package` holds the certificate in an ephemeral keychain it
    # destroys when it is done, issues the App Store profile from the App Store Connect key when
    # the catalog stores none, and signs the package with `day sign apply`, which takes the key
    # material on the command line so the app's [signing] tables are not read and cannot
    # influence which of this runner's variables are used. The same action signs in the shared
    # dayapp.yml workflow, so the two pipelines sign one way.
    - name: List the .apk beside the .aab
      id: apks
      if: inputs.target == 'android-mdc'
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "list<<EOF"
          find "${{ inputs.packages }}" -maxdepth 1 -name '*.apk' | sort
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Sign the package
      id: sign
      uses: daybrite/actions/.github/actions/sign-package@main
      with:
        target: ${{ inputs.target }}
        package: ${{ steps.pick.outputs.package }}
        also-sign: ${{ steps.apks.outputs.list }}
        keystore-b64: ${{ inputs.keystore-b64 }}
        key-alias: ${{ env.APPFAIR_KEY_ALIAS }}
        keystore-password: ${{ env.DAY_SIGN_STORE_PASS }}
        key-password: ${{ env.DAY_SIGN_KEY_PASS }}
        apple-cert-p12: ${{ inputs.apple-cert-p12 }}
        apple-cert-password: ${{ inputs.apple-cert-password }}
        apple-identity: ${{ inputs.apple-identity }}
        apple-profile-b64: ${{ inputs.apple-profile-b64 }}
        # APP_ID comes from the app's manifest, read above; the catalog's value is the fallback
        # for a run that skipped that step.
        app-id: ${{ env.APP_ID || inputs.app-id }}
        apple-team: ${{ inputs.apple-team }}
        asc-key-id: ${{ env.APPFAIR_ASC_KEY_ID }}
        asc-issuer: ${{ env.APPFAIR_ASC_ISSUER }}
        asc-key-path: ${{ env.APPFAIR_ASC_KEY_PATH }}

    # --- Stage the listing and upload, with the shared action --------------------------------
    # daybrite/actions' `store-upload` runs `day store stage` from the app's storefront and
    # places the listing's screenshots: the captures the storefront's screenshots tables name,
    # for every locale, from the tree the verify stage cut out of the release's screenshots.zip
    # and kept as this run's artifact. Nothing is fetched here, so what the reviewer saw is what
    # the store receives; the CLI holds the set to the store's rules once more, and holds the
    # text to `day lint`'s. Then the lane runs in the staged tree with the package and the
    # credentials under the names the generated lanes read.
    - name: Check the channel
      shell: bash
      run: |
        case "${{ inputs.channel }}" in
          apple-app-store|google-play-store) ;;
          *) echo "::error::${{ inputs.channel }} is declared in policy.yaml but not handled here"; exit 1 ;;
        esac

    - name: Upload to ${{ inputs.channel }} (${{ inputs.lane }})
      uses: daybrite/actions/.github/actions/store-upload@main
      with:
        target: ${{ inputs.target }}
        package: ${{ steps.sign.outputs.package }}
        lane: ${{ inputs.lane }}
        project-path: app-data
        flavor: ${{ inputs.flavor }}
        # Empty leaves the stores' screenshots alone (`screenshots: false` in the submission,
        # or a manual publish that asked for it).
        screenshots: ${{ inputs.screenshots != '' && format('{0}/{1}/gallery.json', github.workspace, inputs.screenshots) || '' }}
        asc-key-id: ${{ env.APPFAIR_ASC_KEY_ID }}
        asc-issuer: ${{ env.APPFAIR_ASC_ISSUER }}
        asc-key-path: ${{ env.APPFAIR_ASC_KEY_PATH }}
        play-json-key-path: ${{ env.APPFAIR_PLAY_KEY_PATH }}

    # An upload is not a submission: `deliver` can send a binary while the version stays in
    # Prepare for Submission with nothing attached. These steps read the store's own records.
    - name: Confirm the Play submission
      if: inputs.channel == 'google-play-store'
      shell: bash
      env:
        APPFAIR_PLAY_KEY_PATH: ${{ env.APPFAIR_PLAY_KEY_PATH }}
      run: |
        set -euo pipefail
        # The lane decides which track to look in, and what the release there has to be.
        case "${{ inputs.lane }}" in
          *release) TRACK=production; EXPECT=submitted ;;
          *) TRACK=internal; EXPECT=uploaded ;;
        esac
        python3 scripts/play_state.py --metadata submitted-metadata.json \
          --target "${{ inputs.target }}" --track "$TRACK" --expect "$EXPECT"

    - name: Confirm the App Store submission
      if: inputs.channel == 'apple-app-store'
      shell: bash
      env:
        APPFAIR_ASC_KEY_ID: ${{ env.APPFAIR_ASC_KEY_ID }}
        APPFAIR_ASC_ISSUER: ${{ env.APPFAIR_ASC_ISSUER }}
        APPFAIR_ASC_KEY_PATH: ${{ env.APPFAIR_ASC_KEY_PATH }}
      run: |
        set -euo pipefail
        # A lane that submits has to end with the version submitted; one that only uploads is
        # allowed to leave it in Prepare for Submission, and says so.
        case "${{ inputs.lane }}" in
          *release|*submit) EXPECT=submitted ;;
          *) EXPECT=uploaded ;;
        esac
        python3 scripts/asc_state.py \
          --metadata submitted-metadata.json --target "${{ inputs.target }}" --expect "$EXPECT"

    - name: Upload the signed package
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: published-${{ inputs.token }}-${{ inputs.channel }}
        path: ${{ inputs.packages }}
        if-no-files-found: error
