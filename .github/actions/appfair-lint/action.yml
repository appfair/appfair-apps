# The checks an App Fair app's repository has to pass, as an action its own CI can run.
#
# The catalog runs these on every submission (workflows/pr.yml). An app runs the same rules on
# every push by calling this action, so a problem is found where it is cheap to fix:
#
#     - uses: appfair/appfair-apps/.github/actions/appfair-lint@main
#
# `scripts/test_appfair_lint.py` in this repository covers the rules; `appfair_lint.py --list`
# prints them.
name: App Fair lint
description: >-
  Check an app against the App Fair's rules: the licence texts, the per-file licence notices, and
  the flavor manifest carrying the identity the catalog publishes it under.

inputs:
  path:
    description: The project directory, the one holding Day.toml.
    required: false
    default: "."
  flavor:
    description: The build flavor whose manifest carries the App Fair identity.
    required: false
    default: appfair
  only:
    description: Run only these rules, comma-separated. Empty runs them all.
    required: false
    default: ""
  skip:
    description: Run every rule but these, comma-separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: appfair-lint
      shell: bash
      env:
        # Passed through the environment rather than interpolated into the script, so a value
        # from a caller's workflow cannot become part of the command.
        LINT_PATH: ${{ inputs.path }}
        LINT_FLAVOR: ${{ inputs.flavor }}
        LINT_ONLY: ${{ inputs.only }}
        LINT_SKIP: ${{ inputs.skip }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/appfair_lint.py" \
          --path "$LINT_PATH" \
          --flavor "$LINT_FLAVOR" \
          --only "$LINT_ONLY" \
          --skip "$LINT_SKIP"
