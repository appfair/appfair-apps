# The catalog's rules for an app's repository, as an action the app's own CI can run:
#
#     - uses: appfair/appfair-apps/.github/actions/appfair-lint@main
#
# pr.yml runs the same action on every submission. `appfair_lint.py --list` prints the rules;
# scripts/test_appfair_lint.py covers them.
name: App Fair lint
description: >-
  Check an app against the App Fair's rules: the licence texts (against the app template's own),
  the licence notice in each source file, and the flavor manifest holding the ids it publishes
  under.

inputs:
  path:
    description: The project directory, the one holding Day.toml.
    required: false
    default: "."
  flavor:
    description: The build flavor whose manifest carries the App Fair identity.
    required: false
    default: appfair
  template:
    description: >-
      The App Fair app template the licence texts are compared against, owner/repo@ref.
    required: false
    default: appfair/day-appfair@main
  only:
    description: Run only these rules, comma-separated. Empty runs them all.
    required: false
    default: ""
  skip:
    description: Run every rule but these, comma-separated.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: appfair-lint
      shell: bash
      env:
        # Through the environment, not interpolated, so a caller's value cannot join the command.
        LINT_PATH: ${{ inputs.path }}
        LINT_FLAVOR: ${{ inputs.flavor }}
        LINT_TEMPLATE: ${{ inputs.template }}
        LINT_ONLY: ${{ inputs.only }}
        LINT_SKIP: ${{ inputs.skip }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/appfair_lint.py" \
          --path "$LINT_PATH" \
          --flavor "$LINT_FLAVOR" \
          --template "$LINT_TEMPLATE" \
          --only "$LINT_ONLY" \
          --skip "$LINT_SKIP"
