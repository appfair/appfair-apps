name: Validate a built package
description: >-
  Stage B: check the packages stage A produced against the app's manifest and against the release
  the app's CI published from the same commit, then scan them. Every step reads files; none runs
  the app's code, and this job holds no keys.

inputs:
  token:
    description: The app token, as apps/<token>.yaml names it.
    required: true
  repo:
    description: The app's repository, as owner/name.
    required: true
  ref:
    description: The commit the submission pins, and the one stage A built.
    required: true
  tag:
    description: The tag that commit was released under, for finding the release assets.
    required: true
  target:
    description: The Day target these packages were built for.
    required: true
  flavor:
    description: The build flavor the catalog names, used when the app carries its manifest.
    required: false
    default: appfair
  packages:
    description: The directory holding the packages and their sidecars.
    required: false
    default: packages
  day-version:
    description: Which day CLI reads the app's manifest.
    required: false
    default: main
  allow-mismatch:
    description: Accept differences from the maintainer's release, for a labelled re-run.
    required: false
    default: "false"
  github-token:
    description: A token that can read the app's public releases.
    required: true

runs:
  using: composite
  steps:
    # macOS runners ship a python3 without PyYAML, which the steps below read policy.yaml with.
    - name: Install PyYAML
      shell: bash
      run: |
        set -euo pipefail
        if ! python3 -c "import yaml" 2>/dev/null; then
          # --break-system-packages for a Homebrew python that marks itself externally managed.
          pip3 install --quiet --disable-pip-version-check pyyaml \
            || pip3 install --quiet --disable-pip-version-check --break-system-packages pyyaml
        fi
        python3 -c "import sys, yaml; print('PyYAML', yaml.__version__, 'on python', sys.version.split()[0])"

    # The manifest, store copy and translations only: policy.yaml lists the paths, and the
    # source stays off this runner.
    - name: Read the manifest paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import os, yaml
        paths = yaml.safe_load(open("policy.yaml"))["app-data-paths"]
        print("sparse<<EOF")
        print("\n".join(paths))
        print("EOF")
        PY

    - name: Check out the app's manifest
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: app-data
        sparse-checkout: ${{ steps.paths.outputs.sparse }}
        sparse-checkout-cone-mode: false
        persist-credentials: false

    - uses: daybrite/actions/.github/actions/setup-day-cli@main
      with:
        version: ${{ inputs.day-version }}

    - name: Resolve the build flavor
      id: flavor
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
      run: |
        set -euo pipefail
        # Without `Day-<flavor>.toml` the manifest is read as it stands.
        if [ -n "$FLAVOR" ] && [ -f "app-data/Day-$FLAVOR.toml" ]; then
          echo "args=--flavor $FLAVOR" >> "$GITHUB_OUTPUT"
        else
          echo "args=" >> "$GITHUB_OUTPUT"
          echo "reading ${{ inputs.repo }}'s manifest as it stands${FLAVOR:+ (it carries no Day-$FLAVOR.toml)}"
        fi

    - name: Read the app's metadata
      shell: bash
      env:
        FLAVOR_ARGS: ${{ steps.flavor.outputs.args }}
      run: |
        set -euo pipefail
        # `day metadata` reads Day.toml, the flavor manifest and Cargo.toml, and runs nothing.
        (cd app-data && "$DAY_BIN" $FLAVOR_ARGS metadata --json) > metadata.json
        (cd app-data && "$DAY_BIN" metadata --json) > base-metadata.json
        python3 -c "import json;d=json.load(open('metadata.json'));p=d['project'];print('manifest:',p['id'],p['version'],p['build'])"

    - name: Select the packages
      id: pick
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          android-mdc) primary=$(ls "${{ inputs.packages }}"/*.aab | head -1)
                       sibling=$(ls "${{ inputs.packages }}"/*.apk 2>/dev/null | head -1 || true) ;;
          ios-uikit)   primary=$(ls "${{ inputs.packages }}"/*.ipa | head -1)
                       sibling="" ;;
          *) echo "::error::unknown target ${{ inputs.target }}"; exit 1 ;;
        esac
        [ -n "$primary" ] || { echo "::error::no package for ${{ inputs.target }} in ${{ inputs.packages }}"; exit 1; }
        echo "primary=$primary" >> "$GITHUB_OUTPUT"
        echo "sibling=$sibling" >> "$GITHUB_OUTPUT"
        echo "ext=${primary##*.}" >> "$GITHUB_OUTPUT"

    - name: Inspect the package
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/queue.py inspect \
          --package "${{ steps.pick.outputs.primary }}" \
          ${{ steps.pick.outputs.sibling && format('--sibling {0}', steps.pick.outputs.sibling) || '' }} \
          --out report.json

    - name: Download the maintainer's release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        mkdir -p release
        # What the maintainer built from the same tag, for the comparison below. A release
        # without a counterpart leaves the submission unverifiable, which that step reports.
        if ! gh release download "${{ inputs.tag }}" --repo "${{ inputs.repo }}" \
             --pattern "*.${{ steps.pick.outputs.ext }}" --dir release 2>release.err; then
          echo "::warning::no ${{ steps.pick.outputs.ext }} asset on ${{ inputs.repo }} ${{ inputs.tag }}: $(cat release.err)"
        fi
        # The provenance sidecar day writes beside each package: the comparison reads both
        # sides' tool versions from it.
        gh release download "${{ inputs.tag }}" --repo "${{ inputs.repo }}" \
          --pattern "*.${{ steps.pick.outputs.ext }}.buildinfo.json" --dir release 2>/dev/null \
          || echo "::warning::the release carries no buildinfo sidecar, so the two toolchains cannot be compared"
        ls -l release || true

    - name: Compare the two builds
      shell: bash
      run: |
        set -euo pipefail
        # By the base identity at the submitted commit, not whichever archive sorts first.
        theirs=$(python3 scripts/queue.py select-release --directory release \
          --metadata base-metadata.json --target "${{ inputs.target }}")
        python3 scripts/queue.py compare \
          --ours "${{ steps.pick.outputs.primary }}" --theirs "$theirs" --out compare.json \
          --metadata metadata.json --reference-metadata base-metadata.json \
          --target "${{ inputs.target }}" \
          ${{ inputs.allow-mismatch == 'true' && '--allow-mismatch' || '' }}

    - name: Audit the package
      shell: bash
      run: |
        set -euo pipefail
        # The build's provenance has to name the pinned commit every stage checked out.
        python3 scripts/queue.py audit \
          --app "${{ inputs.token }}" \
          --report report.json \
          --metadata metadata.json \
          --target "${{ inputs.target }}" \
          --sidecars "${{ inputs.packages }}" \
          --expect-commit "${{ inputs.ref }}"

    - name: Scan for malware
      shell: bash
      run: |
        set -euo pipefail
        SCAN=$(python3 -c "import yaml;print(str(yaml.safe_load(open('policy.yaml')).get('virus-scan', True)).lower())")
        if [ "$SCAN" != "true" ]; then
          echo "virus scanning is off in policy.yaml"
          exit 0
        fi
        if [ "$(uname -s)" = Darwin ]; then
          # Homebrew installs freshclam.conf.sample and no config, so write one.
          brew list clamav >/dev/null 2>&1 || brew install clamav
          mkdir -p "$RUNNER_TEMP/clamav"
          printf 'DatabaseDirectory %s\nDatabaseMirror database.clamav.net\n' \
            "$RUNNER_TEMP/clamav" > "$RUNNER_TEMP/freshclam.conf"
          freshclam --quiet --config-file="$RUNNER_TEMP/freshclam.conf"
          DATABASE="$RUNNER_TEMP/clamav"
        else
          # An AppArmor profile confines freshclam to /etc/clamav/freshclam.conf and
          # /var/lib/clamav, so a config under RUNNER_TEMP is denied ("Can't open/parse the
          # config file"). clamscan carries no profile and reads the workspace.
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav >/dev/null
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          # Without clamd.conf freshclam complains about notifying a daemon that is not
          # installed, after the signatures download, so the database decides this.
          sudo freshclam --quiet || true
          DATABASE=/var/lib/clamav
          ls "$DATABASE"/main.c* >/dev/null 2>&1 || {
            echo "::error::freshclam downloaded no ClamAV database"; exit 1; }
        fi
        # clamscan reads archives itself, so nothing is unpacked anywhere it could run.
        clamscan --database="$DATABASE" --recursive --infected --max-filesize=4000M --max-scansize=4000M "${{ inputs.packages }}"

    # Uploaded even on failure, which is when a comparison report is wanted.
    - name: Upload the reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-${{ inputs.token }}-${{ inputs.target }}
        path: |
          report.json
          compare.json
          metadata.json
          base-metadata.json
          ${{ inputs.packages }}/*.buildinfo.json
          release/*.buildinfo.json
        if-no-files-found: warn
