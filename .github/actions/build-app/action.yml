name: Build a submitted app
description: >-
  Stage A: check out an app at the pinned commit, lint it, and pack it unsigned for one target.
  The only stage that runs the app's code, and it holds no secrets.

inputs:
  repo:
    description: The app's repository, as owner/name.
    required: true
  ref:
    description: The commit to build, which a submission pins so a moved tag changes nothing.
    required: true
  target:
    description: The Day target to build, such as ios-uikit or android-mdc.
    required: true
  flavor:
    description: The build flavor carrying the App Fair identity, used when the app carries it.
    required: false
    default: appfair
  day-version:
    description: Which day CLI to build with.
    required: false
    default: main
  out:
    description: Where to leave the packages and their sidecars.
    required: false
    default: packages

runs:
  using: composite
  steps:
    - name: Check out ${{ inputs.repo }}
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: app
        persist-credentials: false

    - name: Resolve the build flavor
      id: flavor
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
      run: |
        set -euo pipefail
        # A flavor keeps the maintainer's builds under the maintainer's id. Without
        # `Day-<flavor>.toml` the project builds as it stands.
        if [ -n "$FLAVOR" ] && [ -f "app/Day-$FLAVOR.toml" ]; then
          echo "args=--flavor $FLAVOR" >> "$GITHUB_OUTPUT"
          echo "building the $FLAVOR flavor"
        else
          echo "args=" >> "$GITHUB_OUTPUT"
          echo "building ${{ inputs.repo }} as it stands${FLAVOR:+ (it carries no Day-$FLAVOR.toml)}"
        fi

    - name: Select the Rust targets
      id: rust
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          ios-uikit)   echo "targets=aarch64-apple-ios,aarch64-apple-ios-sim" >> "$GITHUB_OUTPUT" ;;
          android-mdc) echo "targets=aarch64-linux-android,x86_64-linux-android" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::this queue builds ios-uikit and android-mdc; ${{ inputs.target }} is neither"; exit 1 ;;
        esac

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ steps.rust.outputs.targets }}

    - name: Set up ${{ inputs.target }} dependencies
      uses: daybrite/actions/.github/actions/setup-day-deps@main
      with:
        target: ${{ inputs.target }}
        rust: false
        pack: true

    - uses: daybrite/actions/.github/actions/setup-day-cli@main
      with:
        version: ${{ inputs.day-version }}

    - name: Run day lint
      working-directory: app
      shell: bash
      env:
        FLAVOR_ARGS: ${{ steps.flavor.outputs.args }}
      run: |
        set -euo pipefail
        # Ids, strings, the manifest and the store listing, as in the app's own CI.
        "$DAY_BIN" $FLAVOR_ARGS lint

    - name: Pack ${{ inputs.target }} unsigned
      working-directory: app
      shell: bash
      env:
        DAY_VERBOSE: "1"
        DAY_ANDROID_ABI: arm64-v8a,x86_64
        FLAVOR_ARGS: ${{ steps.flavor.outputs.args }}
      run: |
        set -euo pipefail
        # Unsigned: the signing happens in stage C, which holds the keys and runs no app code.
        "$DAY_BIN" $FLAVOR_ARGS pack \
          -p "${{ inputs.target }}" --no-sign --no-version-in-name --format json | tee "$RUNNER_TEMP/pack-${{ inputs.target }}.json"

    - name: Collect the packages
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.out }}"
        cp app/build/day/dist/* "${{ inputs.out }}/"
        ls -l "${{ inputs.out }}"
        {
          echo "### Built ${{ inputs.repo }} at ${{ inputs.ref }} for ${{ inputs.target }}"
          echo
          echo '| package | size | sha256 |'
          echo '|---|---|---|'
          for f in "${{ inputs.out }}"/*; do
            case "$f" in *.json) continue ;; esac
            echo "| $(basename "$f") | $(wc -c < "$f") | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` |"
          done
        } >> "$GITHUB_STEP_SUMMARY"
