name: Build a submitted app
description: >-
  Stage A. Check out an app at the tag a submission names, lint it, and pack it unsigned for one
  target. This is the only stage that runs code from the app being submitted, so it runs with no
  secrets and produces nothing but files.

inputs:
  repo:
    description: The app's repository, as owner/name.
    required: true
  ref:
    description: >-
      The commit to build. A submission pins one, so what a reviewer read and what gets built are
      the same bytes even when the tag is moved afterwards.
    required: true
  target:
    description: The Day target to build, such as ios-uikit or android-mdc.
    required: true
  flavor:
    description: The Day build flavor carrying the App Fair identity.
    required: false
    default: appfair
  day-version:
    description: Which day CLI to build with.
    required: false
    default: main
  out:
    description: Where to leave the packages and their sidecars.
    required: false
    default: packages

runs:
  using: composite
  steps:
    - name: Check out ${{ inputs.repo }} at ${{ inputs.ref }}
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: app
        persist-credentials: false

    - name: The Rust targets ${{ inputs.target }} needs
      id: rust
      shell: bash
      run: |
        set -euo pipefail
        case "${{ inputs.target }}" in
          ios-uikit)   echo "targets=aarch64-apple-ios,aarch64-apple-ios-sim" >> "$GITHUB_OUTPUT" ;;
          android-mdc) echo "targets=aarch64-linux-android,x86_64-linux-android" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::this queue builds ios-uikit and android-mdc; ${{ inputs.target }} is neither"; exit 1 ;;
        esac

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ steps.rust.outputs.targets }}

    - name: Set up ${{ inputs.target }}
      uses: daybrite/actions/.github/actions/setup-day-deps@main
      with:
        target: ${{ inputs.target }}
        rust: false
        pack: true

    - uses: daybrite/actions/.github/actions/setup-day-cli@main
      with:
        version: ${{ inputs.day-version }}

    - name: Lint the project
      working-directory: app
      shell: bash
      run: |
        set -euo pipefail
        # An App Fair submission is an idiomatic Day project: ids resolve, every string is in the
        # catalogue, the manifest parses, the store listing is complete. `day lint` is the same
        # check the app's own CI runs.
        "$DAY_BIN" --flavor "${{ inputs.flavor }}" lint

    - name: Pack ${{ inputs.target }}, unsigned
      working-directory: app
      shell: bash
      env:
        DAY_VERBOSE: "1"
        DAY_ANDROID_ABI: arm64-v8a,x86_64
      run: |
        set -euo pipefail
        # `--no-sign` is what makes the handoff safe: the package that leaves this stage carries
        # no signature at all, and the App Fair's identity is applied later, where the app's code
        # never runs. The App Fair's keys are absent from this job entirely.
        "$DAY_BIN" --flavor "${{ inputs.flavor }}" pack \
          -p "${{ inputs.target }}" --no-sign --no-version-in-name --format json | tee "$RUNNER_TEMP/pack-${{ inputs.target }}.json"

    - name: Collect the packages
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${{ inputs.out }}"
        cp app/build/day/dist/* "${{ inputs.out }}/"
        ls -l "${{ inputs.out }}"
        {
          echo "### Built ${{ inputs.repo }} at ${{ inputs.ref }} for ${{ inputs.target }}"
          echo
          echo '| package | size | sha256 |'
          echo '|---|---|---|'
          for f in "${{ inputs.out }}"/*; do
            case "$f" in *.json) continue ;; esac
            echo "| $(basename "$f") | $(wc -c < "$f") | \`$(shasum -a 256 "$f" | cut -d' ' -f1)\` |"
          done
        } >> "$GITHUB_STEP_SUMMARY"
